<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AUDAC Rep Portal — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --audac-gold: #d9a653;
    --audac-black: #000000;
    --audac-white: #ffffff;
    --audac-section-bg: #f8f8f8;
    --audac-text: #737373;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    font-family: 'Montserrat', sans-serif;
    background: var(--audac-black);
    color: var(--audac-text);
  }
  .wrap {
    min-height: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--audac-white);
    border-radius: 4px;
    padding: 40px 36px;
    width: 100%;
    max-width: 380px;
  }
  .brand { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 28px; }
  .brand img.logo { height: 34px; }
  .brand .wordmark { font-weight: 700; font-size: 22px; letter-spacing: 3px; color: var(--audac-black); display: none; }
  h1 { font-size: 13px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; color: var(--audac-black); text-align: center; margin: 0 0 24px; }
  label { display: block; font-size: 13px; font-weight: 500; color: var(--audac-black); margin-bottom: 6px; }
  .field { margin-bottom: 16px; }
  input {
    width: 100%;
    font-family: 'Montserrat', sans-serif;
    font-size: 14px;
    padding: 11px 12px;
    border: 1px solid #ddd;
    border-radius: 3px;
    background: #fff;
    color: var(--audac-black);
  }
  button.audac-btn {
    width: 100%;
    background: var(--audac-gold);
    color: #000;
    border: none;
    padding: 13px 0;
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: .5px;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 3px;
    margin-top: 8px;
  }
  button.audac-btn:disabled { opacity: .5; cursor: not-allowed; }
  button.audac-btn-outline {
    width: 100%;
    background: transparent;
    color: var(--audac-black);
    border: 1.5px solid var(--audac-black);
    padding: 11px 0;
    font-family: 'Montserrat', sans-serif;
    font-weight: 500;
    font-size: 13px;
    letter-spacing: .5px;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 3px;
    margin-bottom: 10px;
  }
  button.audac-btn-outline:disabled { opacity: .5; cursor: not-allowed; }
  .divider { display: flex; align-items: center; gap: 10px; margin: 20px 0; font-size: 11px; color: #bbb; text-transform: uppercase; letter-spacing: .5px; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #eee; }
  .link-btn { display: block; width: 100%; text-align: center; background: none; border: none; padding: 8px 4px; margin-top: 10px; font: inherit; font-size: 12.5px; cursor: pointer; text-decoration: underline; color: var(--audac-black); }
  .link-btn:disabled { opacity: .5; cursor: not-allowed; }
  #error-msg {
    display: none;
    background: #fdeaea; color: #a33; border: 1px solid #e0b4b4;
    padding: 10px 14px; border-radius: 3px; margin-bottom: 16px; font-size: 13px;
  }
  .footnote { text-align: center; font-size: 12px; color: #aaa; margin-top: 20px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="brand">
      <img class="logo" src="https://audac.eu/images/AUDAC-logo.webp" alt="AUDAC"
           onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';">
      <span class="wordmark">AUDAC</span>
    </div>
    <div id="error-msg"></div>

    <div id="signin-view">
      <h1>Rep Portal — Sign In</h1>

      <button type="button" class="audac-btn-outline" id="google-signin-btn">Sign in with Google</button>
      <button type="button" class="audac-btn-outline" id="microsoft-signin-btn">Sign in with Microsoft</button>

      <div class="divider">or</div>

      <form id="login-form">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="audac-btn" id="login-btn">Sign In</button>
      </form>
      <button type="button" class="link-btn" id="create-password-btn">New here? Create a password account</button>
      <button type="button" class="link-btn" id="forgot-password-btn">Forgot your password?</button>
      <span id="password-action-status"></span>

      <div class="footnote">Sales reps, managers &amp; executives all sign in here</div>
    </div>

    <div id="recovery-view" hidden>
      <h1>Set a New Password</h1>
      <div class="field">
        <label for="new-password">New Password</label>
        <input type="password" id="new-password" autocomplete="new-password" required>
      </div>
      <button type="button" class="audac-btn" id="set-new-password-btn">Set Password &amp; Sign In</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://dhabmvpngjgrepyklius.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_VfFVm2fmNOwh0HV8vH_Ogw_WypqXEWn';
  const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // A rep reaches /login from their firm-specific form link's "Sign in"
  // button, which appends ?firm=<id>. Stash it now, before any OAuth
  // redirect wipes in-memory JS state, so form.html can claim it onto the
  // rep's profile once they land back there signed in.
  const PENDING_FIRM_KEY = 'audac_pending_firm_id';
  (function stashFirmParam() {
    const firm = new URLSearchParams(window.location.search).get('firm');
    if (firm) localStorage.setItem(PENDING_FIRM_KEY, firm);
  })();

  const errorMsg = document.getElementById('error-msg');
  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.style.display = 'block';
  }

  async function redirectForRole() {
    const { data: { user } } = await client.auth.getUser();
    if (!user) return;
    const { data: profile, error } = await client
      .from('profiles')
      .select('role')
      .eq('id', user.id)
      .maybeSingle();

    if (error || !profile) {
      showError('No portal role is assigned to this account. Contact the AUDAC administrator.');
      await client.auth.signOut();
      return;
    }
    if (profile.role === 'manager') {
      window.location.href = '/dashboard';
    } else if (profile.role === 'executive') {
      window.location.href = '/executive';
    } else if (profile.role === 'rep') {
      window.location.href = '/form';
    } else {
      showError('This account does not have portal access. Contact the AUDAC administrator.');
      await client.auth.signOut();
    }
  }

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.style.display = 'none';
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('login-btn');
    btn.disabled = true;
    btn.textContent = 'Signing In…';

    const { error } = await client.auth.signInWithPassword({ email, password });

    if (error) {
      btn.disabled = false;
      btn.textContent = 'Sign In';
      showError(error.message);
      return;
    }
    await redirectForRole();
    btn.disabled = false;
    btn.textContent = 'Sign In';
  });

  document.getElementById('google-signin-btn').addEventListener('click', async () => {
    errorMsg.style.display = 'none';
    const { error } = await client.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.href.split('#')[0] },
    });
    if (error) showError(error.message);
  });

  document.getElementById('microsoft-signin-btn').addEventListener('click', async () => {
    errorMsg.style.display = 'none';
    const { error } = await client.auth.signInWithOAuth({
      provider: 'azure',
      options: { redirectTo: window.location.href.split('#')[0] },
    });
    if (error) showError(error.message);
  });

  // Self-service password account: a plain signUp, no admin API needed.
  // Works instantly with no email round-trip as long as "Confirm email" is
  // off in Auth settings; if it's on, GoTrue withholds the session until the
  // rep clicks a confirmation link, same email caveats magic link had.
  document.getElementById('create-password-btn').addEventListener('click', async () => {
    errorMsg.style.display = 'none';
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const statusEl = document.getElementById('password-action-status');
    if (!email || !password) { statusEl.textContent = 'Enter an email and a password above, then click this again.'; return; }
    const btn = document.getElementById('create-password-btn');
    btn.disabled = true;
    statusEl.textContent = 'Creating account…';
    const { data, error } = await client.auth.signUp({ email, password });
    btn.disabled = false;
    if (error) { statusEl.textContent = 'Error: ' + error.message; return; }
    if (data.session) {
      statusEl.textContent = '';
      await redirectForRole();
    } else {
      statusEl.textContent = 'Account created — check your email to confirm it, then sign in above.';
    }
  });

  document.getElementById('forgot-password-btn').addEventListener('click', async () => {
    errorMsg.style.display = 'none';
    const email = document.getElementById('email').value.trim();
    const statusEl = document.getElementById('password-action-status');
    if (!email) { statusEl.textContent = 'Enter your email above first.'; return; }
    const btn = document.getElementById('forgot-password-btn');
    btn.disabled = true;
    statusEl.textContent = 'Sending…';
    const { error } = await client.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.href.split('#')[0],
    });
    btn.disabled = false;
    statusEl.textContent = error ? ('Error: ' + error.message) : 'Check your email for a password reset link.';
  });

  function showRecoveryView() {
    document.getElementById('signin-view').hidden = true;
    document.getElementById('recovery-view').hidden = false;
  }

  document.getElementById('set-new-password-btn').addEventListener('click', async () => {
    errorMsg.style.display = 'none';
    const newPassword = document.getElementById('new-password').value;
    if (!newPassword) return;
    const btn = document.getElementById('set-new-password-btn');
    btn.disabled = true;
    btn.textContent = 'Saving…';
    const { error } = await client.auth.updateUser({ password: newPassword });
    btn.disabled = false;
    btn.textContent = 'Set Password & Sign In';
    if (error) { showError(error.message); return; }
    await redirectForRole();
  });

  // Covers four ways a session can show up here: already signed in from a
  // prior visit, a password sign-in/signup above (handled inline too, this
  // is just a safety net), landing back from an OAuth redirect, or landing
  // back from a password-reset link -- the last one is a recovery session
  // that must NOT redirect straight through like the others, so it's
  // detected up front (before the hash is stripped) and routed to the
  // "set a new password" view instead.
  const isRecovery = window.location.hash.includes('type=recovery');
  if (window.location.hash.includes('access_token')) {
    history.replaceState(null, '', window.location.pathname + window.location.search);
  }
  if (isRecovery) {
    showRecoveryView();
  } else {
    client.auth.getSession().then(({ data: { session } }) => {
      if (session) redirectForRole();
    });
  }
  client.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY') {
      showRecoveryView();
    } else if (session) {
      redirectForRole();
    }
  });
</script>
</body>
</html>
