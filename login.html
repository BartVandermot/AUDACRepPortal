<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AUDAC Rep Portal — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/audac-ui.css">
<meta name="theme-color" content="#0b0c0e">
<style>
  .wrap { min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: var(--space-6) var(--space-4); }
  .card { width: 100%; max-width: 420px; padding: var(--space-8) var(--space-6); }
  .brand { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-2); margin-bottom: var(--space-6); }
  .brand b { font-size: 22px; letter-spacing: 5px; font-weight: 700; }
  .brand .brand-logo { height: 60px; }
  .brand span { font-size: 12px; color: var(--color-text-muted); }
  h1 { font-size: 22px; line-height: 28px; font-weight: 650; text-align: center; margin: 0 0 var(--space-6); }
  .card .audac-btn, .card .audac-btn-outline { width: 100%; }
  .card .audac-btn { margin-top: var(--space-2); }
  .card .audac-btn-outline { min-height: 50px; margin-bottom: var(--space-3); }
  .divider { display: flex; align-items: center; gap: var(--space-3); margin: var(--space-5) 0; font-size: 12px; color: var(--color-text-muted); }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--color-border); }
  .card .link-btn { display: block; width: 100%; text-align: center; margin: var(--space-3) 0 0; padding: 10px 4px; color: var(--color-text-secondary); }
  .link-btn:disabled { opacity: .5; cursor: not-allowed; }
  #error-msg { display: none; padding: 12px 16px; border-radius: var(--radius-tile); margin-bottom: var(--space-4); font-size: 14px; line-height: 21px; }
  #password-action-status, #signup-status { display: block; text-align: center; font-size: 14px; line-height: 21px; color: var(--color-text-secondary); margin-top: var(--space-2); }
  .footnote { text-align: center; font-size: 13px; line-height: 19px; color: var(--color-text-muted); margin-top: var(--space-5); }
</style>
</head>
<body>
<div class="wrap">
  <div class="card surface-card--elevated">
    <div class="brand"><img class="brand-logo" src="/assets/audac-logo.webp" alt="AUDAC" width="56" height="60"><span>Rep Portal</span></div>
    <div id="error-msg"></div>

    <div id="signin-view">
      <h1>Sign in</h1>

      <button type="button" class="audac-btn-outline" id="google-signin-btn">Sign in with Google</button>
      <button type="button" class="audac-btn-outline" id="microsoft-signin-btn">Sign in with Microsoft</button>

      <div class="divider">or</div>

      <form id="login-form">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="audac-btn" id="login-btn">Sign In</button>
      </form>
      <button type="button" class="link-btn" id="show-signup-btn">New here? Create an account</button>
      <button type="button" class="link-btn" id="forgot-password-btn">Forgot your password?</button>
      <span id="password-action-status"></span>

      <div class="footnote">Sales reps, managers &amp; executives all sign in here</div>
    </div>

    <div id="signup-view" hidden>
      <h1>Create Your Account</h1>
      <form id="signup-form">
        <div class="field">
          <label for="signup-fullname">Full Name</label>
          <input type="text" id="signup-fullname" autocomplete="name" placeholder="e.g. Jane Smith" required>
        </div>
        <div class="field">
          <label for="signup-email">Email</label>
          <input type="email" id="signup-email" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" autocomplete="new-password" required>
        </div>
        <button type="submit" class="audac-btn" id="signup-btn">Create Account</button>
      </form>
      <span id="signup-status"></span>
      <button type="button" class="link-btn" id="back-to-signin-btn">Already have an account? Sign in</button>

      <div class="footnote">Signing up with Google or Microsoft instead? Go back and use those buttons — no form needed.</div>
    </div>

    <div id="recovery-view" hidden>
      <h1>Set a New Password</h1>
      <div class="field">
        <label for="new-password">New Password</label>
        <input type="password" id="new-password" autocomplete="new-password" required>
      </div>
      <button type="button" class="audac-btn" id="set-new-password-btn">Set Password &amp; Sign In</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://dhabmvpngjgrepyklius.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_VfFVm2fmNOwh0HV8vH_Ogw_WypqXEWn';
  const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // A rep reaches /login from their firm-specific form link's "Sign in"
  // button, which appends ?firm=<id>. Stash it now, before any OAuth
  // redirect wipes in-memory JS state, so form.html can claim it onto the
  // rep's profile once they land back there signed in.
  const PENDING_FIRM_KEY = 'audac_pending_firm_id';
  (function stashFirmParam() {
    const firm = new URLSearchParams(window.location.search).get('firm');
    if (firm) localStorage.setItem(PENDING_FIRM_KEY, firm);
  })();

  const errorMsg = document.getElementById('error-msg');
  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.style.display = 'block';
  }

  async function redirectForRole() {
    const { data: { user } } = await client.auth.getUser();
    if (!user) return;
    const { data: profile, error } = await client
      .from('profiles')
      .select('role')
      .eq('id', user.id)
      .maybeSingle();

    if (error || !profile) {
      showError('No portal role is assigned to this account. Contact the AUDAC administrator.');
      await client.auth.signOut();
      return;
    }
    if (profile.role === 'manager') {
      window.location.href = '/dashboard';
    } else if (profile.role === 'executive') {
      window.location.href = '/executive';
    } else if (profile.role === 'rep') {
      window.location.href = '/home';
    } else {
      showError('This account does not have portal access. Contact the AUDAC administrator.');
      await client.auth.signOut();
    }
  }

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.style.display = 'none';
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('login-btn');
    btn.disabled = true;
    btn.textContent = 'Signing In…';

    const { error } = await client.auth.signInWithPassword({ email, password });

    if (error) {
      btn.disabled = false;
      btn.textContent = 'Sign In';
      showError(error.message);
      return;
    }
    await redirectForRole();
    btn.disabled = false;
    btn.textContent = 'Sign In';
  });

  document.getElementById('google-signin-btn').addEventListener('click', async () => {
    errorMsg.style.display = 'none';
    const { error } = await client.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.href.split('#')[0] },
    });
    if (error) showError(error.message);
  });

  document.getElementById('microsoft-signin-btn').addEventListener('click', async () => {
    errorMsg.style.display = 'none';
    const { error } = await client.auth.signInWithOAuth({
      provider: 'azure',
      options: { redirectTo: window.location.href.split('#')[0] },
    });
    if (error) showError(error.message);
  });

  function showSignupView() {
    errorMsg.style.display = 'none';
    document.getElementById('signup-status').textContent = '';
    document.getElementById('signin-view').hidden = true;
    document.getElementById('signup-view').hidden = false;
    // Carry over whatever they'd already typed on the sign-in screen so
    // switching views doesn't feel like starting over.
    document.getElementById('signup-email').value = document.getElementById('email').value.trim();
    document.getElementById('signup-fullname').focus();
  }
  function showSigninView() {
    errorMsg.style.display = 'none';
    document.getElementById('signup-view').hidden = true;
    document.getElementById('signin-view').hidden = false;
  }
  document.getElementById('show-signup-btn').addEventListener('click', showSignupView);
  document.getElementById('back-to-signin-btn').addEventListener('click', showSigninView);

  // Self-service password account: a plain signUp, no admin API needed.
  // Works instantly with no email round-trip as long as "Confirm email" is
  // off in Auth settings; if it's on, GoTrue withholds the session until the
  // rep clicks a confirmation link, same email caveats magic link had.
  document.getElementById('signup-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.style.display = 'none';
    const fullName = document.getElementById('signup-fullname').value.trim();
    const email = document.getElementById('signup-email').value.trim();
    const password = document.getElementById('signup-password').value;
    const statusEl = document.getElementById('signup-status');
    const btn = document.getElementById('signup-btn');
    btn.disabled = true;
    btn.textContent = 'Creating Account…';
    statusEl.textContent = '';
    const { data, error } = await client.auth.signUp({ email, password, options: { data: { full_name: fullName } } });
    btn.disabled = false;
    btn.textContent = 'Create Account';
    if (error) { statusEl.textContent = 'Error: ' + error.message; return; }
    if (data.session) {
      await redirectForRole();
    } else if (data.user && data.user.identities && data.user.identities.length === 0) {
      // Supabase returns this same "success" shape whether or not the email
      // is new, to avoid letting a caller enumerate registered emails --
      // an empty identities array on an unconfirmed, sessionless response is
      // its documented signal that this email already has an account (e.g.
      // via Google/Microsoft) rather than one being newly created here.
      statusEl.textContent = "This email already has an account. Go back and use \"Forgot your password?\", or sign in with Google/Microsoft if that's how you originally signed up.";
    } else {
      statusEl.textContent = 'Account created — check your email to confirm it, then sign in.';
    }
  });

  document.getElementById('forgot-password-btn').addEventListener('click', async () => {
    errorMsg.style.display = 'none';
    const email = document.getElementById('email').value.trim();
    const statusEl = document.getElementById('password-action-status');
    if (!email) { statusEl.textContent = 'Enter your email above first.'; return; }
    const btn = document.getElementById('forgot-password-btn');
    btn.disabled = true;
    statusEl.textContent = 'Sending…';
    const { error } = await client.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.href.split('#')[0],
    });
    btn.disabled = false;
    statusEl.textContent = error ? ('Error: ' + error.message) : 'Check your email for a password reset link.';
  });

  function showRecoveryView() {
    document.getElementById('signin-view').hidden = true;
    document.getElementById('signup-view').hidden = true;
    document.getElementById('recovery-view').hidden = false;
  }

  document.getElementById('set-new-password-btn').addEventListener('click', async () => {
    errorMsg.style.display = 'none';
    const newPassword = document.getElementById('new-password').value;
    if (!newPassword) return;
    const btn = document.getElementById('set-new-password-btn');
    btn.disabled = true;
    btn.textContent = 'Saving…';
    const { error } = await client.auth.updateUser({ password: newPassword });
    btn.disabled = false;
    btn.textContent = 'Set Password & Sign In';
    if (error) { showError(error.message); return; }
    await redirectForRole();
  });

  // Covers four ways a session can show up here: already signed in from a
  // prior visit, a password sign-in/signup above (handled inline too, this
  // is just a safety net), landing back from an OAuth redirect, or landing
  // back from a password-reset link -- the last one is a recovery session
  // that must NOT redirect straight through like the others, so it's
  // detected up front (before the hash is stripped) and routed to the
  // "set a new password" view instead.
  const isRecovery = window.location.hash.includes('type=recovery');
  if (window.location.hash.includes('access_token')) {
    history.replaceState(null, '', window.location.pathname + window.location.search);
  }
  if (isRecovery) {
    showRecoveryView();
  } else {
    client.auth.getSession().then(({ data: { session } }) => {
      if (session) redirectForRole();
    });
  }
  client.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY') {
      showRecoveryView();
    } else if (session) {
      redirectForRole();
    }
  });
</script>
</body>
</html>
