<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AUDAC Rep Portal — Activity Submission</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --audac-gold: #d9a653;
    --audac-black: #000000;
    --audac-white: #ffffff;
    --audac-section-bg: #f8f8f8;
    --audac-text: #737373;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    font-family: 'Montserrat', sans-serif;
    background: var(--audac-white);
    color: var(--audac-text);
  }
  header.audac-header {
    background: var(--audac-black);
    color: #fff;
    padding: 18px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header.audac-header .brand { display: flex; align-items: center; gap: 12px; }
  header.audac-header img.logo { height: 32px; filter: invert(1); }
  header.audac-header .wordmark {
    font-weight: 700; font-size: 20px; letter-spacing: 3px; color: #fff; display: none;
  }
  header.audac-header h1 {
    font-size: 15px; font-weight: 400; margin: 0; color: var(--audac-gold);
    letter-spacing: 1px; text-transform: uppercase;
  }
  main { max-width: 780px; margin: 0 auto; padding: 32px 20px 80px; }
  .card {
    background: var(--audac-section-bg);
    border-radius: 4px;
    padding: 24px;
    margin-bottom: 20px;
  }
  h2 { font-size: 16px; font-weight: 700; color: var(--audac-black); margin: 0 0 16px; text-transform: uppercase; letter-spacing: .5px; }
  label { display: block; font-size: 13px; font-weight: 500; color: var(--audac-black); margin-bottom: 6px; }
  .field { margin-bottom: 16px; }
  input, select, textarea {
    width: 100%;
    font-family: 'Montserrat', sans-serif;
    font-size: 16px; /* iOS Safari zooms the page on focus for any input under 16px */
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 3px;
    background: #fff;
    color: var(--audac-black);
  }
  textarea { min-height: 64px; resize: vertical; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; }
  .row .field { flex: 1; min-width: 200px; }
  .checkbox-field { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
  .checkbox-field input { width: auto; }
  .checkbox-field label { margin: 0; }
  .activity-entry {
    background: #fff;
    border: 1px solid #e5e5e5;
    border-radius: 4px;
    padding: 20px;
    margin-bottom: 16px;
    position: relative;
  }
  .activity-entry .entry-title { font-weight: 700; color: var(--audac-black); font-size: 13px; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 14px; }
  .remove-entry {
    position: absolute; top: 8px; right: 8px; padding: 10px 12px;
    background: none; border: none; color: #b33; font-size: 13px; cursor: pointer; font-weight: 500;
  }
  button.audac-btn {
    background: var(--audac-gold);
    color: #000;
    border: none;
    padding: 13px 28px;
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: .5px;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 3px;
  }
  button.audac-btn:hover { opacity: .88; }
  button.audac-btn:disabled { opacity: .5; cursor: not-allowed; }
  button.audac-btn-outline {
    background: transparent;
    color: var(--audac-black);
    border: 1.5px solid var(--audac-black);
    padding: 11px 24px;
    font-family: 'Montserrat', sans-serif;
    font-weight: 500;
    font-size: 13px;
    letter-spacing: .5px;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 3px;
  }
  .actions { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
  #error-banner {
    display: none;
    background: #fdeaea; color: #a33; border: 1px solid #e0b4b4;
    padding: 12px 16px; border-radius: 3px; margin-bottom: 16px; font-size: 13px;
  }
  #confirmation {
    display: none;
    text-align: center;
    padding: 60px 20px;
  }
  #confirmation .check {
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--audac-gold); color: #000;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; margin: 0 auto 20px;
  }
  #confirmation h2 { text-align: center; }
  #confirmation p { color: var(--audac-text); font-size: 14px; }
  select.firm-locked { background: #eee; color: #555; }
  .hint { font-size: 12px; color: #999; margin-top: 4px; }

  .combo { position: relative; }
  .combo-list {
    position: absolute; top: 100%; left: 0; right: 0; z-index: 20;
    background: #fff; border: 1px solid #ddd; border-top: none; border-radius: 0 0 3px 3px;
    max-height: 220px; overflow-y: auto; box-shadow: 0 4px 10px rgba(0,0,0,.1);
  }
  .combo-item { padding: 12px; font-size: 13.5px; cursor: pointer; color: var(--audac-black); }
  .combo-item:hover { background: #f6ecd8; }
  .combo-item-sub { color: #999; font-size: 11.5px; margin-left: 6px; }
  .combo-item-new { color: var(--audac-gold); font-weight: 600; border-top: 1px solid #eee; }
  .combo-status { font-size: 11.5px; margin-top: 4px; min-height: 14px; }
  .combo-status.linked { color: #2e7d32; }
  .combo-status.error { color: #b3261e; }
  .contact-field { display: none; }
  .contact-field.active { display: block; }

  #auth-bar { font-size: 12.5px; color: var(--audac-text); margin-bottom: 16px; text-align: right; }
  /* Tap targets: a bare 12.5px underlined text link with no padding measures out
     to a ~15px-tall hit area on a real phone -- padding here doesn't change how
     it looks, just how forgiving it is to actually tap. */
  .link-btn { background: none; border: none; padding: 8px 4px; margin: -8px -4px; font: inherit; font-size: 12.5px; cursor: pointer; text-decoration: underline; color: var(--audac-black); }
  .link-btn.danger { color: #b3261e; }
  #signin-form { display: inline-flex; align-items: center; gap: 8px; margin-top: 6px; flex-wrap: wrap; justify-content: flex-end; }
  #signin-form input { flex: 1; min-width: 160px; max-width: 220px; font-size: 16px; padding: 7px 10px; display: inline-block; }
  #signin-status { font-size: 12px; }

  table.detail { width: 100%; border-collapse: collapse; background: #fff; font-size: 12.5px; }
  table.detail th, table.detail td { padding: 8px 10px; border-bottom: 1px solid #eee; text-align: left; }
  table.detail th { background: #f1f1f1; }
  tr.activity-edit-row td { background: #fbf7ee; padding: 16px; border-bottom: 2px solid var(--audac-gold); }
  .edit-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 14px; margin-bottom: 10px; }
  .edit-grid label, tr.activity-edit-row > td > label { display: block; font-size: 11.5px; font-weight: 500; color: var(--audac-black); margin-bottom: 10px; }
  .edit-grid input, .edit-grid select, tr.activity-edit-row textarea {
    display: block; width: 100%; font-size: 16px; padding: 6px 8px; margin-top: 3px;
  }
  tr.activity-edit-row textarea { min-height: 44px; resize: vertical; }
  .ae-checkbox { display: flex !important; align-items: center; gap: 6px; margin-top: 12px; }
  .ae-checkbox input { width: auto !important; margin: 0; }
  .ae-status { font-size: 12px; margin-left: 8px; color: #b3261e; }

  @media (max-width: 480px) {
    .edit-grid { grid-template-columns: 1fr; }
    table.detail { font-size: 11.5px; }
  }
  .muted { color: #bbb; }
  tr.attachments-row td { background: #fbf7ee; padding: 14px 20px; }

  input[type="file"] { font-family: 'Montserrat', sans-serif; font-size: 12.5px; padding: 6px 0; border: none; }
  .attachment-preview { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .attachment-chip {
    display: inline-flex; align-items: center; gap: 6px; background: #f1f1f1; border-radius: 3px;
    padding: 5px 8px; font-size: 12px; color: var(--audac-black);
  }
  .attachment-chip-remove { background: none; border: none; color: #b3261e; cursor: pointer; font-size: 14px; font-weight: 700; padding: 8px; margin: -8px; line-height: 1; }
</style>
</head>
<body>

<header class="audac-header">
  <div class="brand">
    <img class="logo" src="https://audac.eu/images/AUDAC-logo.webp" alt="AUDAC"
         onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';">
    <span class="wordmark">AUDAC</span>
  </div>
  <h1>Rep Activity Submission</h1>
</header>

<main>
  <div id="auth-bar">
    <div id="auth-signed-out">
      <button type="button" class="link-btn" id="show-signin-btn">Sign in to view or edit your past submissions</button>
      <div id="signin-form" hidden>
        <input type="email" id="signin-email" placeholder="you@example.com">
        <button type="button" class="audac-btn-outline" id="send-magic-link-btn">Send Magic Link</button>
        <span id="signin-status"></span>
      </div>
    </div>
    <div id="auth-signed-in" hidden>
      Signed in as <strong id="signed-in-email"></strong> —
      <button type="button" class="link-btn" id="sign-out-btn">Sign Out</button>
    </div>
  </div>

  <div id="my-submissions-section" hidden>
    <h2 style="padding-left:4px;" id="my-submissions-heading">My Submissions</h2>
    <div id="my-submissions-list"></div>
    <hr style="border:none; border-top:1px solid #eee; margin:28px 0;">
  </div>

  <div id="error-banner"></div>

  <form id="activity-form">
    <div class="card">
      <h2>Firm &amp; Reporting Period</h2>
      <div class="row">
        <div class="field">
          <label for="firm-select">Rep Firm</label>
          <select id="firm-select" required></select>
        </div>
        <div class="field">
          <label for="reporting-month">Reporting Month</label>
          <input type="month" id="reporting-month" required>
        </div>
      </div>
    </div>

    <h2 style="padding-left:4px;">Activity Entries</h2>
    <div id="entries-container"></div>

    <button type="button" class="audac-btn-outline" id="add-entry-btn">+ Add Another Activity</button>

    <div class="actions" style="margin-top:28px;">
      <span class="hint" id="entry-count-hint"></span>
      <button type="submit" class="audac-btn" id="submit-btn">Submit Activities</button>
    </div>
  </form>

  <div id="confirmation">
    <div class="check">&#10003;</div>
    <h2 id="confirmation-title">Submitted</h2>
    <p id="confirmation-detail"></p>
    <button type="button" class="audac-btn-outline" id="submit-more-btn">Submit More Activities</button>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://dhabmvpngjgrepyklius.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_VfFVm2fmNOwh0HV8vH_Ogw_WypqXEWn';
  const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const CONTACT_TYPES = ['Dealer', 'Consultant', 'End User'];
  const ACTIVITY_TYPES = [
    'Brand Introduction', 'Demo', 'Follow Up', 'Lunch & Learn',
    'Online Demo', 'Dealer Training', 'Other'
  ];

  let entryCounter = 0;
  let firmsCache = [];
  let currentSession = null;
  let currentProfile = null;
  const PENDING_FIRM_KEY = 'audac_pending_firm_id';
  const entriesContainer = document.getElementById('entries-container');
  const firmSelect = document.getElementById('firm-select');
  const monthInput = document.getElementById('reporting-month');
  const errorBanner = document.getElementById('error-banner');

  function showError(msg) {
    errorBanner.textContent = msg;
    errorBanner.style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function clearError() {
    errorBanner.style.display = 'none';
  }

  function todayISO() {
    const d = new Date();
    return d.toISOString().slice(0, 10);
  }
  function currentMonthValue() {
    const d = new Date();
    return d.toISOString().slice(0, 7);
  }

  function buildOptions(values, placeholder) {
    let html = `<option value="" disabled selected>${placeholder}</option>`;
    for (const v of values) html += `<option value="${v}">${v}</option>`;
    return html;
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  function debounce(fn, ms) {
    let t;
    return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
  }

  document.addEventListener('click', (e) => {
    if (e.target.closest('.combo')) return;
    document.querySelectorAll('.combo-list').forEach(el => { el.hidden = true; });
  });

  // Lets a rep search existing CRM accounts/contacts (via security-definer RPCs --
  // crm_accounts/crm_contacts themselves stay manager-only) or create a new one on
  // the fly if the company/contact isn't in CRM yet. Selection/creation just sets
  // {account,contact}ExternalId on the entry block's dataset; collectEntries() reads
  // it at submit time. Editing the text after a selection un-links it (falls back
  // to plain free text, same as before this feature existed).
  function wireCompanyCombo(block) {
    const input = block.querySelector('.account-input');
    const list = block.querySelector('.account-list');
    const statusEl = block.querySelector('.account-status');
    const contactField = block.querySelector('.contact-field');

    function selectAccount(acc) {
      input.value = acc.name;
      block.dataset.accountExternalId = acc.external_id;
      statusEl.textContent = '✓ Linked to CRM';
      statusEl.className = 'combo-status account-status linked';
      list.hidden = true;
      contactField.classList.add('active');
      wireContactCombo(block);
    }

    async function createNew(name) {
      if (!name) return;
      const firmId = firmSelect.value || null;
      input.disabled = true;
      try {
        const { data, error } = await client.rpc('create_manual_crm_account', {
          p_name: name, p_city: null, p_state_code: null, p_rep_firm_id: firmId,
        });
        if (error) throw error;
        selectAccount({ external_id: data, name });
      } catch (err) {
        statusEl.textContent = 'Could not add company: ' + err.message;
        statusEl.className = 'combo-status account-status error';
      } finally {
        input.disabled = false;
      }
    }

    input.addEventListener('input', debounce(async () => {
      delete block.dataset.accountExternalId;
      statusEl.textContent = '';
      statusEl.className = 'combo-status account-status';
      contactField.classList.remove('active');
      clearContact(block);
      const q = input.value.trim();
      if (q.length < 2) { list.hidden = true; return; }
      const { data, error } = await client.rpc('search_crm_accounts', { p_query: q, p_limit: 8 });
      const matches = error ? [] : (data || []);
      list.innerHTML = matches.map(a => `
        <div class="combo-item" data-external-id="${escapeHtml(a.external_id)}" data-name="${escapeHtml(a.name)}">
          ${escapeHtml(a.name)}${a.city || a.state_code ? ` <span class="combo-item-sub">${escapeHtml([a.city, a.state_code].filter(Boolean).join(', '))}</span>` : ''}
        </div>
      `).join('') + `<div class="combo-item combo-item-new" data-new="1">+ Add "${escapeHtml(q)}" as a new company</div>`;
      list.hidden = false;
    }, 250));

    list.addEventListener('click', (e) => {
      const item = e.target.closest('.combo-item');
      if (!item) return;
      if (item.dataset.new) createNew(input.value.trim());
      else selectAccount({ external_id: item.dataset.externalId, name: item.dataset.name });
    });
  }

  function clearContact(block) {
    delete block.dataset.contactExternalId;
    const input = block.querySelector('.contact-input');
    const statusEl = block.querySelector('.contact-status');
    const list = block.querySelector('.contact-list');
    if (input) input.value = '';
    if (statusEl) { statusEl.textContent = ''; statusEl.className = 'combo-status contact-status'; }
    if (list) { list.hidden = true; list.innerHTML = ''; }
  }

  function wireContactCombo(block) {
    const input = block.querySelector('.contact-input');
    const list = block.querySelector('.contact-list');
    const statusEl = block.querySelector('.contact-status');

    function selectContact(c) {
      input.value = c.full_name || c.email || '';
      block.dataset.contactExternalId = c.external_id;
      statusEl.textContent = '✓ Linked to CRM';
      statusEl.className = 'combo-status contact-status linked';
      list.hidden = true;
    }

    async function createNew(name) {
      const accountExternalId = block.dataset.accountExternalId;
      if (!name || !accountExternalId) return;
      input.disabled = true;
      try {
        const { data, error } = await client.rpc('create_manual_crm_contact', {
          p_account_external_id: accountExternalId, p_full_name: name, p_email: null,
        });
        if (error) throw error;
        selectContact({ external_id: data, full_name: name });
      } catch (err) {
        statusEl.textContent = 'Could not add contact: ' + err.message;
        statusEl.className = 'combo-status contact-status error';
      } finally {
        input.disabled = false;
      }
    }

    input.oninput = debounce(async () => {
      delete block.dataset.contactExternalId;
      statusEl.textContent = '';
      statusEl.className = 'combo-status contact-status';
      const accountExternalId = block.dataset.accountExternalId;
      const q = input.value.trim();
      if (!accountExternalId) { list.hidden = true; return; }
      const { data, error } = await client.rpc('search_crm_contacts', { p_account_external_id: accountExternalId });
      let matches = error ? [] : (data || []);
      if (q) {
        const nq = q.toLowerCase();
        matches = matches.filter(c => (c.full_name || '').toLowerCase().includes(nq) || (c.email || '').toLowerCase().includes(nq));
      }
      const newItem = q ? `<div class="combo-item combo-item-new" data-new="1">+ Add "${escapeHtml(q)}" as a new contact</div>` : '';
      list.innerHTML = matches.slice(0, 8).map(c => `
        <div class="combo-item" data-external-id="${escapeHtml(c.external_id)}" data-name="${escapeHtml(c.full_name || '')}">
          ${escapeHtml(c.full_name || '(no name)')}${c.email ? ` <span class="combo-item-sub">${escapeHtml(c.email)}</span>` : ''}
        </div>
      `).join('') + newItem;
      list.hidden = !matches.length && !q;
    }, 250);

    list.onclick = (e) => {
      const item = e.target.closest('.combo-item');
      if (!item) return;
      if (item.dataset.new) createNew(input.value.trim());
      else selectContact({ external_id: item.dataset.externalId, full_name: item.dataset.name });
    };
  }

  // Client-side checks mirror the bucket's own file_size_limit/allowed_mime_types
  // (the real, server-enforced guardrail) -- this is just faster feedback before
  // an upload that would fail anyway. Files stay in memory on the block itself
  // (pendingFiles) until the entry is actually inserted and has a real id.
  const ATTACHMENT_MAX_FILES = 3;
  const ATTACHMENT_MAX_BYTES = 5 * 1024 * 1024;
  const ATTACHMENT_ALLOWED_TYPES = ['image/jpeg', 'image/png', 'image/webp', 'image/heic', 'image/heif'];

  function wireAttachmentInput(block) {
    const input = block.querySelector('.attachment-input');
    const preview = block.querySelector('.attachment-preview');
    block.pendingFiles = [];

    function renderPreview() {
      preview.innerHTML = block.pendingFiles.map((f, i) => `
        <span class="attachment-chip">${escapeHtml(f.name)} <button type="button" class="attachment-chip-remove" data-remove-file="${i}">×</button></span>
      `).join('');
      preview.querySelectorAll('[data-remove-file]').forEach(btn => {
        btn.addEventListener('click', () => {
          block.pendingFiles.splice(Number(btn.dataset.removeFile), 1);
          renderPreview();
        });
      });
    }

    input.addEventListener('change', () => {
      const errors = [];
      for (const f of [...input.files]) {
        if (block.pendingFiles.length >= ATTACHMENT_MAX_FILES) { errors.push(`Maximum ${ATTACHMENT_MAX_FILES} photos per activity.`); break; }
        if (!ATTACHMENT_ALLOWED_TYPES.includes(f.type)) { errors.push(`${f.name}: unsupported file type.`); continue; }
        if (f.size > ATTACHMENT_MAX_BYTES) { errors.push(`${f.name}: exceeds 5MB.`); continue; }
        block.pendingFiles.push(f);
      }
      input.value = '';
      if (errors.length) alert(errors.join('\n'));
      renderPreview();
    });
  }

  // ---------- Light auth (passwordless magic link) + My Submissions ----------
  // The public form stays fully anonymous by default (no login required to
  // submit, matching the original design). Signing in is purely opt-in.
  // Every sign-in gets a profiles row (role='rep') auto-created by a DB trigger
  // on auth.users -- no manager setup needed per rep. The firm the rep was on
  // when they signed in gets self-claimed onto their profile exactly once
  // (claim_rep_firm RPC), via PENDING_FIRM_KEY stashed in localStorage before
  // the magic-link redirect (in-memory JS state doesn't survive that redirect).
  // A rep flagged is_rep_admin by a manager then sees/can edit their whole
  // firm's entries, not just their own -- enforced by RLS
  // (activity_entries_select/update/delete_firm_admin), not by this client code.
  async function initAuth() {
    if (window.location.hash.includes('access_token')) {
      history.replaceState(null, '', window.location.pathname + window.location.search);
    }
    const { data: { session } } = await client.auth.getSession();
    currentSession = session;
    renderAuthState();
    if (session) await handleSignedIn();

    client.auth.onAuthStateChange(async (_event, session) => {
      currentSession = session;
      renderAuthState();
      if (session) {
        await handleSignedIn();
      } else {
        currentProfile = null;
        document.getElementById('my-submissions-section').hidden = true;
      }
    });
  }

  async function handleSignedIn() {
    const { data: profile } = await client.from('profiles').select('*').eq('id', currentSession.user.id).maybeSingle();
    currentProfile = profile;

    const pendingFirmId = localStorage.getItem(PENDING_FIRM_KEY);
    if (pendingFirmId && !profile?.rep_firm_id) {
      const { error } = await client.rpc('claim_rep_firm', { p_firm_id: pendingFirmId });
      if (!error) {
        localStorage.removeItem(PENDING_FIRM_KEY);
        const { data: refreshed } = await client.from('profiles').select('*').eq('id', currentSession.user.id).maybeSingle();
        currentProfile = refreshed;
      }
    }

    if (currentProfile?.rep_firm_id) lockFirmToProfile(currentProfile.rep_firm_id);
    await loadMySubmissions();
  }

  function lockFirmToProfile(firmId) {
    if (firmSelect.disabled) return; // already locked via a ?firm= link
    const match = firmsCache.find(f => f.id === firmId);
    if (!match) return;
    firmSelect.innerHTML = `<option value="${match.id}" selected>${escapeHtml(match.name)} — ${escapeHtml(match.territory)}</option>`;
    firmSelect.disabled = true;
    firmSelect.classList.add('firm-locked');
  }

  function renderAuthState() {
    document.getElementById('auth-signed-out').hidden = !!currentSession;
    document.getElementById('auth-signed-in').hidden = !currentSession;
    if (currentSession) document.getElementById('signed-in-email').textContent = currentSession.user.email;
  }

  document.getElementById('show-signin-btn').addEventListener('click', () => {
    document.getElementById('signin-form').hidden = false;
    document.getElementById('show-signin-btn').hidden = true;
  });

  document.getElementById('send-magic-link-btn').addEventListener('click', async () => {
    const email = document.getElementById('signin-email').value.trim();
    const statusEl = document.getElementById('signin-status');
    if (!email) { statusEl.textContent = 'Enter your email first.'; return; }
    // Remembered across the magic-link email round trip so the firm this rep was
    // on gets claimed onto their profile once they're actually signed in.
    if (firmSelect.value) localStorage.setItem(PENDING_FIRM_KEY, firmSelect.value);
    const btn = document.getElementById('send-magic-link-btn');
    btn.disabled = true;
    statusEl.textContent = 'Sending…';
    const { error } = await client.auth.signInWithOtp({
      email,
      options: { emailRedirectTo: window.location.href.split('#')[0] },
    });
    btn.disabled = false;
    statusEl.textContent = error ? ('Error: ' + error.message) : 'Check your email for a sign-in link.';
  });

  document.getElementById('sign-out-btn').addEventListener('click', async () => {
    await client.auth.signOut();
  });

  let attachmentCountByEntry = new Map();

  async function loadMySubmissions() {
    const section = document.getElementById('my-submissions-section');
    section.hidden = false;
    const showCreator = !!currentProfile?.is_rep_admin;
    document.getElementById('my-submissions-heading').textContent = showCreator ? "My Firm's Submissions" : 'My Submissions';
    const container = document.getElementById('my-submissions-list');
    container.innerHTML = '<div class="hint">Loading…</div>';
    // RLS scopes this automatically -- created_by = auth.uid() for a regular
    // rep, or (if is_rep_admin) any entry for their firm regardless of who
    // created it. No explicit filter needed here either way.
    const { data, error } = await client.from('activity_entries').select('*').order('entry_date', { ascending: false });
    if (error) {
      container.innerHTML = `<div class="hint">Failed to load your submissions: ${escapeHtml(error.message)}</div>`;
      return;
    }
    if (!data.length) {
      container.innerHTML = '<div class="hint">No submissions linked to this account yet. Entries you submit while signed in will show up here.</div>';
      return;
    }
    await fetchAllAttachmentCounts();
    container.innerHTML = renderMySubmissionsTable(data, showCreator);
    wireActivityRows(container, data, loadMySubmissions);
  }

  function renderMySubmissionsTable(rows, showCreator) {
    return `<table class="detail"><thead><tr>
      <th>Date</th><th>Firm</th>${showCreator ? '<th>Submitted By</th>' : ''}<th>Account</th><th>Contact Type</th><th>Activity Type</th><th>Topic / Opportunity</th><th>Files</th><th>Actions</th>
    </tr></thead><tbody>${rows.map(r => activityRowHtml(r, showCreator)).join('')}</tbody></table>`;
  }

  function activityRowHtml(r, showCreator) {
    const firmName = escapeHtml((firmsCache.find(f => f.id === r.rep_firm_id) || {}).name || '');
    const creatorCell = showCreator ? `<td>${escapeHtml(r.created_by_email || 'Anonymous')}</td>` : '';
    const attCount = attachmentCountByEntry.get(r.id) || 0;
    const filesCell = attCount > 0
      ? `<button type="button" class="link-btn" data-toggle-attachments="${r.id}">📎 ${attCount}</button>`
      : '<span class="muted">—</span>';
    return `
      <tr data-activity-id="${r.id}">
        <td>${r.entry_date}</td>
        <td>${firmName}</td>
        ${creatorCell}
        <td>${escapeHtml(r.account_name)}</td>
        <td>${r.contact_type}</td>
        <td>${r.activity_type}</td>
        <td>${escapeHtml(r.topic_opportunity || '')}</td>
        <td>${filesCell}</td>
        <td>
          <button type="button" class="link-btn" data-edit-activity="${r.id}">Edit</button>
          <button type="button" class="link-btn danger" data-delete-activity="${r.id}">Delete</button>
        </td>
      </tr>
    `;
  }

  function wireActivityRows(container, rows, onChanged) {
    const byId = new Map(rows.map(r => [String(r.id), r]));
    container.querySelectorAll('[data-edit-activity]').forEach(btn => {
      btn.addEventListener('click', () => {
        const tr = btn.closest('tr');
        openActivityEditor(tr, byId.get(btn.dataset.editActivity), onChanged);
      });
    });
    container.querySelectorAll('[data-delete-activity]').forEach(btn => {
      btn.addEventListener('click', () => deleteActivityEntry(btn.dataset.deleteActivity, onChanged));
    });
    container.querySelectorAll('[data-toggle-attachments]').forEach(btn => {
      btn.addEventListener('click', () => {
        const tr = btn.closest('tr');
        toggleAttachments(tr, btn.dataset.toggleAttachments);
      });
    });
  }

  async function fetchAllAttachmentCounts() {
    const { data } = await client.from('activity_attachments').select('activity_entry_id');
    attachmentCountByEntry = new Map();
    (data || []).forEach(a => {
      attachmentCountByEntry.set(a.activity_entry_id, (attachmentCountByEntry.get(a.activity_entry_id) || 0) + 1);
    });
  }

  async function toggleAttachments(tr, entryId) {
    const table = tr.closest('table');
    const existingNext = tr.nextElementSibling;
    if (existingNext && existingNext.classList.contains('attachments-row')) {
      existingNext.remove();
      return;
    }
    table.querySelectorAll('.attachments-row').forEach(el => el.remove());
    const colspan = tr.children.length;
    const attRow = document.createElement('tr');
    attRow.className = 'attachments-row';
    attRow.innerHTML = `<td colspan="${colspan}"></td>`;
    tr.after(attRow);
    await renderAttachmentsInto(attRow, entryId);
  }

  async function renderAttachmentsInto(attRow, entryId) {
    const td = attRow.querySelector('td');
    td.innerHTML = '<div class="hint">Loading attachments…</div>';
    const { data, error } = await client.from('activity_attachments').select('*').eq('activity_entry_id', entryId).order('uploaded_at');
    if (error) { td.innerHTML = `<div class="hint">Failed to load attachments: ${escapeHtml(error.message)}</div>`; return; }
    if (!data.length) { td.innerHTML = '<div class="hint">No attachments.</div>'; return; }

    const withUrls = await Promise.all(data.map(async (a) => {
      const { data: signed } = await client.storage.from('activity-attachments').createSignedUrl(a.storage_path, 3600);
      return { ...a, url: signed?.signedUrl || null };
    }));

    td.innerHTML = `<div style="display:flex; gap:14px; flex-wrap:wrap;">${withUrls.map(a => `
      <div style="text-align:center;">
        ${a.url ? `<a href="${a.url}" target="_blank" rel="noopener"><img src="${a.url}" alt="${escapeHtml(a.file_name || '')}" style="width:100px; height:100px; object-fit:cover; border-radius:4px; border:1px solid #ddd; display:block;"></a>` : '<div class="hint">Preview unavailable</div>'}
        <div style="font-size:11px; color:#999; max-width:100px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(a.file_name || '')}</div>
        <button type="button" class="link-btn danger" data-delete-attachment="${a.id}" data-storage-path="${escapeHtml(a.storage_path)}" style="font-size:11px;">Delete</button>
      </div>
    `).join('')}</div>`;

    td.querySelectorAll('[data-delete-attachment]').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Delete this attachment?')) return;
        await client.storage.from('activity-attachments').remove([btn.dataset.storagePath]);
        await client.from('activity_attachments').delete().eq('id', btn.dataset.deleteAttachment);
        await fetchAllAttachmentCounts();
        renderAttachmentsInto(attRow, entryId);
      });
    });
  }

  function openActivityEditor(tr, row, onChanged) {
    const table = tr.closest('table');
    const existingNext = tr.nextElementSibling;
    if (existingNext && existingNext.classList.contains('activity-edit-row')) {
      existingNext.remove();
      return;
    }
    table.querySelectorAll('.activity-edit-row').forEach(el => el.remove());

    const colspan = tr.children.length;
    const editRow = document.createElement('tr');
    editRow.className = 'activity-edit-row';
    editRow.innerHTML = `<td colspan="${colspan}">
      <div class="edit-grid">
        <label>Date<input type="date" class="ae-date" value="${row.entry_date}"></label>
        <label>Account<input type="text" class="ae-account" value="${escapeHtml(row.account_name)}"></label>
        <label>Contact<input type="text" class="ae-contact" value="${escapeHtml(row.contact_name || '')}"></label>
        <label>Contact Type<select class="ae-contact-type">${CONTACT_TYPES.map(v => `<option value="${v}">${v}</option>`).join('')}</select></label>
        <label>Activity Type<select class="ae-activity-type">${ACTIVITY_TYPES.map(v => `<option value="${v}">${v}</option>`).join('')}</select></label>
        <label class="ae-checkbox"><input type="checkbox" class="ae-demo" ${row.demo_gear_used ? 'checked' : ''}> Demo gear used</label>
      </div>
      <label>Topic / Opportunity<textarea class="ae-topic">${escapeHtml(row.topic_opportunity || '')}</textarea></label>
      <label>Solution Feedback<textarea class="ae-solution">${escapeHtml(row.solution_feedback || '')}</textarea></label>
      <label>Competitive Feedback<textarea class="ae-competitive">${escapeHtml(row.competitive_feedback || '')}</textarea></label>
      <label>Additional Comments<textarea class="ae-additional">${escapeHtml(row.additional_comments || '')}</textarea></label>
      <div class="actions" style="justify-content:flex-start; gap:10px;">
        <button type="button" class="audac-btn" data-ae-save>Save</button>
        <button type="button" class="audac-btn-outline" data-ae-cancel>Cancel</button>
        <span class="ae-status"></span>
      </div>
    </td>`;
    tr.after(editRow);
    editRow.querySelector('.ae-contact-type').value = row.contact_type;
    editRow.querySelector('.ae-activity-type').value = row.activity_type;

    editRow.querySelector('[data-ae-cancel]').addEventListener('click', () => editRow.remove());
    editRow.querySelector('[data-ae-save]').addEventListener('click', async () => {
      const statusEl = editRow.querySelector('.ae-status');
      const accountName = editRow.querySelector('.ae-account').value.trim();
      if (!accountName) { statusEl.textContent = 'Account name is required.'; return; }
      const patch = {
        entry_date: editRow.querySelector('.ae-date').value,
        account_name: accountName,
        contact_name: editRow.querySelector('.ae-contact').value.trim() || null,
        contact_type: editRow.querySelector('.ae-contact-type').value,
        activity_type: editRow.querySelector('.ae-activity-type').value,
        demo_gear_used: editRow.querySelector('.ae-demo').checked,
        topic_opportunity: editRow.querySelector('.ae-topic').value.trim() || null,
        solution_feedback: editRow.querySelector('.ae-solution').value.trim() || null,
        competitive_feedback: editRow.querySelector('.ae-competitive').value.trim() || null,
        additional_comments: editRow.querySelector('.ae-additional').value.trim() || null,
      };
      statusEl.style.color = '#999';
      statusEl.textContent = 'Saving…';
      const { error } = await client.from('activity_entries').update(patch).eq('id', row.id);
      if (error) {
        statusEl.style.color = '#b3261e';
        statusEl.textContent = 'Error: ' + error.message;
        return;
      }
      onChanged();
    });
  }

  async function deleteActivityEntry(id, onChanged) {
    if (!confirm('Delete this submission? This cannot be undone.')) return;
    // The FK cascade removes the activity_attachments row when the entry goes,
    // but not the actual file in Storage -- and once that metadata row is gone,
    // nothing can reach the file via RLS to clean it up later. Remove the storage
    // objects first so nothing gets orphaned.
    const { data: attachments } = await client.from('activity_attachments').select('storage_path').eq('activity_entry_id', id);
    if (attachments && attachments.length) {
      await client.storage.from('activity-attachments').remove(attachments.map(a => a.storage_path));
    }
    const { error } = await client.from('activity_entries').delete().eq('id', id);
    if (error) { alert('Delete failed: ' + error.message); return; }
    onChanged();
  }

  function addEntry() {
    entryCounter += 1;
    const idx = entryCounter;
    const wrap = document.createElement('div');
    wrap.className = 'activity-entry';
    wrap.dataset.idx = idx;
    wrap.innerHTML = `
      <button type="button" class="remove-entry" data-remove="${idx}">Remove</button>
      <div class="entry-title">Activity #<span class="entry-num">${idx}</span></div>
      <div class="row">
        <div class="field">
          <label>Entry Date</label>
          <input type="date" name="entry_date" value="${todayISO()}" required>
        </div>
        <div class="field">
          <label>Account / Company</label>
          <div class="combo">
            <input type="text" name="account_name" class="account-input" placeholder="Start typing a company name…" autocomplete="off" required>
            <div class="combo-list account-list" hidden></div>
          </div>
          <div class="combo-status account-status"></div>
        </div>
      </div>
      <div class="field contact-field">
        <label>Contact (optional)</label>
        <div class="combo">
          <input type="text" class="contact-input" placeholder="Start typing a contact name…" autocomplete="off">
          <div class="combo-list contact-list" hidden></div>
        </div>
        <div class="combo-status contact-status"></div>
      </div>
      <div class="row">
        <div class="field">
          <label>Contact Type</label>
          <select name="contact_type" required>${buildOptions(CONTACT_TYPES, 'Select contact type')}</select>
        </div>
        <div class="field">
          <label>Activity Type</label>
          <select name="activity_type" required>${buildOptions(ACTIVITY_TYPES, 'Select activity type')}</select>
        </div>
      </div>
      <div class="checkbox-field">
        <input type="checkbox" name="demo_gear_used" id="demo-gear-${idx}">
        <label for="demo-gear-${idx}">Demo gear used during this activity</label>
      </div>
      <div class="field">
        <label>Topic / Opportunity</label>
        <textarea name="topic_opportunity" placeholder="What was discussed or the opportunity identified"></textarea>
      </div>
      <div class="field">
        <label>Solution Feedback</label>
        <textarea name="solution_feedback" placeholder="Feedback on AUDAC solutions"></textarea>
      </div>
      <div class="field">
        <label>Competitive Feedback</label>
        <textarea name="competitive_feedback" placeholder="Competitor mentions or positioning notes"></textarea>
      </div>
      <div class="field">
        <label>Additional Comments</label>
        <textarea name="additional_comments"></textarea>
      </div>
      <div class="field">
        <label>Photos (optional — up to 3, JPG/PNG/WEBP/HEIC, max 5MB each)</label>
        <input type="file" class="attachment-input" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" multiple>
        <div class="attachment-preview"></div>
      </div>
    `;
    entriesContainer.appendChild(wrap);
    wireCompanyCombo(wrap);
    wireAttachmentInput(wrap);
    updateEntryHint();
  }

  function removeEntry(idx) {
    const el = entriesContainer.querySelector(`.activity-entry[data-idx="${idx}"]`);
    if (!el) return;
    if (entriesContainer.children.length <= 1) {
      showError('At least one activity entry is required.');
      return;
    }
    el.remove();
    updateEntryHint();
  }

  function updateEntryHint() {
    const n = entriesContainer.children.length;
    document.getElementById('entry-count-hint').textContent = `${n} activity ${n === 1 ? 'entry' : 'entries'}`;
  }

  entriesContainer.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-remove]');
    if (btn) removeEntry(btn.dataset.remove);
  });
  document.getElementById('add-entry-btn').addEventListener('click', addEntry);

  async function loadFirms() {
    const params = new URLSearchParams(window.location.search);
    const presetFirmId = params.get('firm');

    const { data, error } = await client
      .from('rep_firms')
      .select('id, name, territory')
      .eq('status', 'active')
      .order('name');

    if (error) {
      showError('Could not load rep firms: ' + error.message);
      return;
    }
    firmsCache = data;

    if (presetFirmId) {
      const match = data.find(f => f.id === presetFirmId);
      if (match) {
        firmSelect.innerHTML = `<option value="${match.id}" selected>${match.name} — ${match.territory}</option>`;
        firmSelect.disabled = true;
        firmSelect.classList.add('firm-locked');
        return;
      }
    }

    firmSelect.innerHTML = `<option value="" disabled selected>Select your firm</option>` +
      data.map(f => `<option value="${f.id}">${f.name} — ${f.territory}</option>`).join('');
  }

  function collectEntries() {
    const blocks = [...entriesContainer.querySelectorAll('.activity-entry')];
    return blocks.map(block => {
      const get = (name) => block.querySelector(`[name="${name}"]`);
      const contactInput = block.querySelector('.contact-input');
      return {
        entry_date: get('entry_date').value,
        account_name: get('account_name').value.trim(),
        account_external_id: block.dataset.accountExternalId || null,
        contact_name: (contactInput && contactInput.value.trim()) || null,
        contact_external_id: block.dataset.contactExternalId || null,
        contact_type: get('contact_type').value,
        activity_type: get('activity_type').value,
        demo_gear_used: get('demo_gear_used').checked,
        topic_opportunity: get('topic_opportunity').value.trim() || null,
        solution_feedback: get('solution_feedback').value.trim() || null,
        competitive_feedback: get('competitive_feedback').value.trim() || null,
        additional_comments: get('additional_comments').value.trim() || null,
      };
    });
  }

  function validate(firmId, month, entries) {
    if (!firmId) return 'Please select your rep firm.';
    if (!month) return 'Please select the reporting month.';
    for (const [i, e] of entries.entries()) {
      if (!e.entry_date || !e.account_name || !e.contact_type || !e.activity_type) {
        return `Activity #${i + 1} is missing a required field.`;
      }
    }
    return null;
  }

  document.getElementById('activity-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    clearError();

    const firmId = firmSelect.value;
    const month = monthInput.value;
    const blocks = [...entriesContainer.querySelectorAll('.activity-entry')];
    const entries = collectEntries();

    const validationError = validate(firmId, month, entries);
    if (validationError) {
      showError(validationError);
      return;
    }

    const submitBtn = document.getElementById('submit-btn');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting…';

    // ids are generated client-side (rather than read back via .insert().select())
    // because .select() after an insert makes PostgREST evaluate this table's
    // SELECT policies to build the RETURNING result -- and the manager/executive
    // policy calls current_role_name(), which anon has no EXECUTE grant on. That
    // throws "permission denied for function current_role_name" for anonymous
    // (not-signed-in) submissions specifically. Supplying the id ourselves avoids
    // RETURNING entirely, so anonymous submission stays exactly as unrestricted
    // as it was before attachments existed.
    const rows = entries.map(e => ({
      id: crypto.randomUUID(),
      rep_firm_id: firmId,
      reporting_month: month,
      created_by: currentSession?.user?.id || null,
      created_by_email: currentSession?.user?.email || null,
      ...e,
    }));

    const { error } = await client.from('activity_entries').insert(rows);

    if (error) {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Submit Activities';
      showError('Submission failed: ' + error.message);
      return;
    }

    // Photos can only upload now that each entry has a real id (the storage path
    // is "<entry-id>/<filename>"). A photo failure here doesn't roll back the
    // entry itself -- the activity data already saved; only that one photo is
    // missing, surfaced in the confirmation message.
    submitBtn.textContent = 'Uploading photos…';
    const uploadErrors = [];
    await Promise.all(blocks.map(async (block, i) => {
      const files = block.pendingFiles || [];
      if (!files.length) return;
      const entryId = rows[i].id;
      for (const file of files) {
        const path = `${entryId}/${Date.now()}-${file.name}`;
        const { error: upErr } = await client.storage.from('activity-attachments').upload(path, file, { contentType: file.type });
        if (upErr) { uploadErrors.push(`${file.name}: ${upErr.message}`); continue; }
        const { error: metaErr } = await client.from('activity_attachments').insert({
          activity_entry_id: entryId, storage_path: path, file_name: file.name,
          content_type: file.type, uploaded_by: currentSession?.user?.id || null,
        });
        if (metaErr) uploadErrors.push(`${file.name}: ${metaErr.message}`);
      }
    }));

    submitBtn.disabled = false;
    submitBtn.textContent = 'Submit Activities';

    const firmLabel = firmSelect.selectedOptions[0]?.textContent || '';
    document.getElementById('confirmation-detail').textContent =
      `${entries.length} activity ${entries.length === 1 ? 'entry' : 'entries'} submitted for ${firmLabel} — ${month}.` +
      (uploadErrors.length ? ` Note: ${uploadErrors.length} photo(s) failed to upload — ${uploadErrors.join('; ')}` : '');
    document.getElementById('activity-form').style.display = 'none';
    document.getElementById('confirmation').style.display = 'block';
    if (currentSession) loadMySubmissions();
  });

  document.getElementById('submit-more-btn').addEventListener('click', () => {
    entriesContainer.innerHTML = '';
    addEntry();
    document.getElementById('confirmation').style.display = 'none';
    document.getElementById('activity-form').style.display = 'block';
  });

  monthInput.value = currentMonthValue();
  addEntry();
  (async () => {
    await loadFirms(); // firmsCache must be populated before My Submissions can show firm names
    await initAuth();
  })();
</script>
</body>
</html>
