<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AUDAC Rep Portal — My territory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="/assets/audac-ui.css?v=e4e7bc94">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="AUDAC Reps">
<meta name="theme-color" content="#0b0c0e">
<style>
  .intro { margin: 0 0 var(--space-5); font-size: 14px; line-height: 21px; color: var(--color-text-secondary); max-width: 70ch; }
  .section { padding: var(--space-6); margin-bottom: var(--space-4); }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-3); flex-wrap: wrap; }
  .section-head p { margin: var(--space-1) 0 0; font-size: 14px; line-height: 21px; color: var(--color-text-secondary); }

  .list { list-style: none; margin: var(--space-4) 0 0; padding: 0; }
  .list > li { display: grid; grid-template-columns: 1fr auto; gap: var(--space-2) var(--space-4); align-items: center; padding: var(--space-3) 0; border-top: 1px solid var(--color-border); }
  .list > li:first-child { border-top: 0; }
  .list b { display: block; font-size: 15px; line-height: 22px; font-weight: 600; overflow-wrap: anywhere; }
  .list .sub { display: block; font-size: 13.5px; line-height: 20px; color: var(--color-text-secondary); }
  .list .sub.warn { color: var(--color-warning); }
  .list .actions { display: flex; gap: var(--space-2); align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .list .button-secondary { min-height: 40px; padding: 0 14px; font-size: 13.5px; }
  .group-title { margin: var(--space-5) 0 0; font-size: 12px; line-height: 16px; font-weight: 650; letter-spacing: 1px; text-transform: uppercase; color: var(--color-text-muted); }
  .empty { margin: var(--space-3) 0 0; font-size: 14px; color: var(--color-text-secondary); }
  .value { font-variant-numeric: tabular-nums; }

  .update-form { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-3); padding: var(--space-4); margin-top: var(--space-1); border-radius: var(--radius-tile); background: var(--well-bg); box-shadow: var(--depth-well); }
  .update-form .field { margin: 0; }
  .update-form .wide { grid-column: 1 / -1; }
  .update-form .form-actions { grid-column: 1 / -1; display: flex; gap: var(--space-2); justify-content: flex-end; }
  .update-form .button-primary { width: auto; min-height: 40px; padding: 0 18px; }
  .update-form textarea { min-height: 60px; }
  .lead-contact { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 2px; font-size: 13.5px; line-height: 20px; }
  .lead-contact a { color: var(--color-gold); text-decoration: none; overflow-wrap: anywhere; }
  .lead-contact a:hover { text-decoration: underline; }
  .lead-desc { margin: 4px 0 0; font-size: 13.5px; line-height: 20px; color: var(--color-text-secondary); white-space: pre-line; overflow-wrap: anywhere; }
  details.older { margin-top: var(--space-4); }
  details.older summary { cursor: pointer; font-size: 13.5px; font-weight: 600; color: var(--color-text-secondary); }
  details.older summary:focus-visible { outline: 2px solid var(--color-gold); outline-offset: 2px; border-radius: 4px; }
  .update-form.lead-form { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); }
  .form-msg { grid-column: 1 / -1; margin: 0; font-size: 13.5px; color: var(--color-danger); }

  /* Search stays at hand while scrolling a long territory. */
  .search-bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; margin: 0 calc(-1 * var(--space-2)) var(--space-4); padding: var(--space-2); border-radius: 18px; background: rgba(11, 12, 14, 0.82); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
  .section { scroll-margin-top: 130px; }
  .filters .count { display: inline-grid; place-items: center; min-width: 20px; height: 20px; margin-left: 6px; padding: 0 6px; border-radius: 999px; background: var(--color-gold); color: #171714; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .acct-head .sub .key { color: var(--color-gold-light); font-weight: 600; }
  .meta-note { margin: var(--space-1) 0 0; font-size: 13px; line-height: 19px; color: var(--color-text-muted); }
  .meta-note a { color: var(--color-text-secondary); }
  .search-bar input[type="search"] { width: 100%; min-height: 48px; font-size: 16px; }
  .filters { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-2); }
  .filters button { min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--color-border); background: rgba(255,255,255,0.04); color: var(--color-text-secondary); font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer; }
  .filters button[aria-pressed="true"] { color: var(--color-gold-light); background: var(--color-gold-tint); border-color: rgba(217,166,83,0.4); }
  .filters button:focus-visible { outline: 2px solid var(--color-gold); outline-offset: 2px; }
  .no-results { margin: 0 0 var(--space-4); }

  .accts { list-style: none; margin: var(--space-4) 0 0; padding: 0; }
  .accts > li { border-top: 1px solid var(--color-border); }
  .accts > li:first-child { border-top: 0; }
  .acct-head { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-3) 0; background: none; border: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  .acct-head:focus-visible { outline: 2px solid var(--color-gold); outline-offset: 2px; border-radius: 6px; }
  .acct-head b { display: block; font-size: 15px; line-height: 22px; font-weight: 600; overflow-wrap: anywhere; }
  .acct-head .sub { display: block; font-size: 13.5px; line-height: 20px; color: var(--color-text-secondary); }
  .acct-head .tags { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; flex-shrink: 0; max-width: 50%; }
  .acct-head .caret { flex-shrink: 0; width: 16px; height: 16px; color: var(--color-text-muted); transition: transform .15s; }
  .acct-head[aria-expanded="true"] .caret { transform: rotate(180deg); }
  .acct-detail { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-4); padding: var(--space-4); margin: 0 0 var(--space-3); border-radius: var(--radius-tile); background: var(--well-bg); box-shadow: var(--depth-well); font-size: 14px; line-height: 21px; }
  .acct-detail h3 { margin: 0 0 4px; font-size: 12px; line-height: 16px; font-weight: 650; letter-spacing: 1px; text-transform: uppercase; color: var(--color-text-muted); }
  .acct-detail p, .acct-detail ul { margin: 0; }
  .acct-detail ul { list-style: none; padding: 0; display: grid; gap: 6px; }
  .acct-detail a { color: var(--color-gold); text-decoration: none; overflow-wrap: anywhere; }
  .acct-detail a:hover { text-decoration: underline; }
  .acct-detail .muted { color: var(--color-text-secondary); }
  .acct-detail .wide { grid-column: 1 / -1; }
  .acct-detail .detail-actions { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: var(--space-2); }
  .acct-detail .button-secondary { min-height: 40px; padding: 0 14px; font-size: 13.5px; }
  .show-more { margin-top: var(--space-3); }
  @media (max-width: 760px) {
    .acct-detail { grid-template-columns: 1fr; }
    .filters { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; gap: 6px; }
    .filters::-webkit-scrollbar { display: none; }
    .filters button { flex: none; padding: 0 12px; font-size: 13px; }
  }

  @media (max-width: 760px) {
    .section { padding: var(--space-5); }
    .list > li { grid-template-columns: 1fr; }
    .list .actions { justify-content: flex-start; }
    .update-form, .update-form.lead-form { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar glass-floating" id="app-sidebar" aria-label="Main menu"></aside>
  <div class="app-content">
    <header class="topbar">
      <h1>My territory</h1>
      <span class="spacer"></span>
      <button type="button" class="icon-btn mobile-only" id="mobile-signout" aria-label="Sign out" title="Sign out"></button>
    </header>

    <main class="page" id="page" aria-busy="true">
      <div id="gate"></div>

      <div class="search-bar" id="search-bar" role="search">
        <input type="search" id="q" aria-label="Search your territory" placeholder="Company, person, city or project" autocomplete="off" enterkeyhint="search">
        <div class="filters" role="group" aria-label="Show">
          <button type="button" data-filter="all" aria-pressed="true">All</button>
          <button type="button" data-filter="leads" aria-pressed="false">Leads<span class="count" id="n-leads" hidden></span></button>
          <button type="button" data-filter="deals" aria-pressed="false">Deals<span class="count" id="n-deals" hidden></span></button>
          <button type="button" data-filter="key" aria-pressed="false">Key accounts</button>
        </div>
      </div>
      <div class="notice info no-results" id="no-results" hidden></div>

      <section class="section surface-card" id="leads-section" aria-labelledby="leads-h">
        <div class="section-head">
          <div>
            <h2 class="card-title" id="leads-h">Leads from AUDAC</h2>
            <p id="leads-sub">Loading…</p>
          </div>
        </div>
        <div id="leads-list"></div>
      </section>

      <section class="section surface-card" id="deals-section" aria-labelledby="deals-h">
        <div class="section-head">
          <div>
            <h2 class="card-title" id="deals-h">Your deals</h2>
            <p id="deals-sub">Loading…</p>
            <p class="meta-note">New project with AUDAC specified? <a href="https://avlmediagroup.com/project-registration/" target="_blank" rel="noopener">Register it with AVL Media Group ↗</a></p>
          </div>
        </div>
        <div id="deals-list"></div>
      </section>

      <section class="section surface-card" id="companies-section" aria-labelledby="companies-h">
        <div class="section-head">
          <div>
            <h2 class="card-title" id="companies-h">Companies</h2>
            <p id="companies-sub">Loading…</p>
          </div>
        </div>
        <div id="companies-list"></div>
      </section>

    </main>
  </div>
</div>
<nav class="bottom-nav glass-floating" id="app-bottom-nav" aria-label="Main menu"></nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0"></script>
<script src="/assets/audac-shell.js?v=2be5df8a"></script>
<script src="/assets/audac-outbox.js?v=6c442eab"></script>
<script>
  const SUPABASE_URL = 'https://dhabmvpngjgrepyklius.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_VfFVm2fmNOwh0HV8vH_Ogw_WypqXEWn';
  const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  AudacShell.mount('territory');
  const signOut = async () => { await client.auth.signOut(); window.location.href = '/login'; };
  AudacShell.onSignOut(signOut);
  $('mobile-signout').innerHTML = AudacShell.icon('out');
  $('mobile-signout').addEventListener('click', signOut);

  const today = new Date(); today.setHours(0, 0, 0, 0);
  const todayIso = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
  const DAY = 86400000;
  const fmtDate = (iso) => iso ? new Date(iso + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '';
  const fmtMoney = (n) => n == null ? '' : Number(n).toLocaleString('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
  // "Nov 6" this year, "Nov 6, 2025" otherwise.
  const fmtShort = (iso) => iso ? new Date(iso + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', ...(iso.slice(0, 4) === String(today.getFullYear()) ? {} : { year: 'numeric' }) }) : '';
  const daysAgo = (iso) => Math.round((today - new Date(iso + 'T00:00:00')) / DAY);

  // ---------- Search & filters ----------
  // One search box over everything on the page: companies (name, city, ZIP,
  // contacts, deals), deals and leads. Every word typed has to match.
  let query = '';
  let filter = 'all';
  const norm = (s) => String(s == null ? '' : s).toLowerCase();
  const hit = (hay) => !query || query.split(/\s+/).filter(Boolean).every(t => hay.includes(t));

  // ---------- Companies ----------
  let accountsCache = [];
  let openAcct = null;
  let showAllCompanies = false;
  const COMPANY_PAGE = 40;

  function companyHay(a) {
    return norm([a.name, a.street, a.city, a.state_code, a.zip, a.phone, a.website, a.relationship_type, a.business_type, a.key_reason,
      ...(a.contacts || []).flatMap(c => [c.name, c.email]), ...(a.open_deals || []).map(d => d.name)].join(' '));
  }

  const webHref = (w) => /^https?:\/\//i.test(w) ? w : `https://${w}`;
  const telHref = (p) => `tel:${String(p).replace(/[^\d+]/g, '')}`;

  function companyDetail(a) {
    const address = [a.street, [a.city, [a.state_code, a.zip].filter(Boolean).join(' ')].filter(Boolean).join(', ')].filter(Boolean).join(', ');
    const mapHref = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent([a.name, address].filter(Boolean).join(', '))}`;
    const reach = [
      address ? `<li><a href="${mapHref}" target="_blank" rel="noopener">${esc(address)}</a></li>` : '',
      a.phone ? `<li><a href="${telHref(a.phone)}">${esc(a.phone)}</a></li>` : '',
      a.website ? `<li><a href="${esc(webHref(a.website))}" target="_blank" rel="noopener">${esc(a.website.replace(/^https?:\/\//i, '').replace(/\/$/, ''))}</a></li>` : '',
    ].filter(Boolean).join('');
    const type = [a.relationship_type, a.business_type, a.key_reason].filter(Boolean).join(' · ');
    const contacts = (a.contacts || []).map(c => `<li>${esc(c.name || '(no name)')}${c.email ? ` · <a href="mailto:${esc(c.email)}">${esc(c.email)}</a>` : ''}${c.phone ? ` · <a href="${telHref(c.phone)}">${esc(c.phone)}</a>` : ''}</li>`).join('');
    const deals = (a.open_deals || []).map(d => `<li>${esc(d.name || '(no name)')}${d.value != null ? ` · <span class="value">${fmtMoney(d.value)}</span>` : ''}${d.close ? ` · expected ${fmtDate(d.close)}` : ''}</li>`).join('');
    const logged = a.logged_count
      ? `Your firm logged ${a.logged_count} ${a.logged_count === 1 ? 'activity' : 'activities'} here, the last on ${fmtDate(a.last_logged)}.`
      : 'Nothing logged here yet.';
    const logHref = `/form?account=${encodeURIComponent(a.external_id)}&name=${encodeURIComponent(a.name)}`;
    return `<div class="acct-detail" id="acct-${esc(a.external_id)}">
      <div><h3>Where</h3>${reach ? `<ul>${reach}</ul>` : '<p class="muted">No address or phone in the CRM.</p>'}</div>
      <div><h3>Type</h3><p class="${type ? '' : 'muted'}">${esc(type || 'Not set in the CRM')}</p></div>
      <div><h3>Contacts</h3>${contacts ? `<ul>${contacts}</ul>` : '<p class="muted">No contacts in the CRM yet.</p>'}</div>
      <div><h3>Open deals</h3>${deals ? `<ul>${deals}</ul>` : '<p class="muted">None.</p>'}</div>
      <p class="wide muted">${logged}${a.added_by_firm ? ' Added by your firm; on its way to AUDAC’s CRM.' : ''}</p>
      <div class="detail-actions"><a class="button-secondary" href="${logHref}">${AudacShell.icon('plus')}Log activity</a></div>
    </div>`;
  }

  function companyItem(a) {
    const open = openAcct === a.external_id;
    const place = [a.city, a.state_code].filter(Boolean).join(', ');
    const nDeals = (a.open_deals || []).length;
    // One line under the name: key-account reason (gold), place, deals, last logged.
    const sub = [
      a.key_reason ? `<span class="key">${esc(a.key_reason)}</span>` : '',
      esc(place),
      nDeals ? `${nDeals} open deal${nDeals === 1 ? '' : 's'}` : '',
      a.added_by_firm ? 'added by your firm' : '',
      a.last_logged ? `logged ${esc(fmtShort(a.last_logged))}` : '',
    ].filter(Boolean).join(' · ');
    return `<li data-acct="${esc(a.external_id)}">
      <button type="button" class="acct-head" aria-expanded="${open}" aria-controls="acct-${esc(a.external_id)}">
        <span><b>${esc(a.name)}</b>${sub ? `<span class="sub">${sub}</span>` : ''}</span>
        <span class="caret">${AudacShell.icon('down')}</span>
      </button>
      ${open ? companyDetail(a) : ''}
    </li>`;
  }

  function renderCompanies() {
    const show = filter === 'all' || filter === 'key';
    let rows = accountsCache.filter(a => hit(a._hay));
    if (filter === 'key') rows = rows.filter(a => a.key_reason);
    // Key accounts first when browsing; plain A-Z when searching.
    if (!query) rows.sort((x, y) => (!!y.key_reason - !!x.key_reason) || x.name.localeCompare(y.name));
    $('companies-section').hidden = !show || (!!query && !rows.length);
    if (!show) return 0;
    const keyCount = accountsCache.filter(a => a.key_reason).length;
    $('companies-sub').textContent = query
      ? `${rows.length} ${rows.length === 1 ? 'company' : 'companies'} found.`
      : filter === 'key'
        ? `${rows.length} key accounts: TOP AUDAC LEADs and AUDAC partners in your territory.`
        : `${accountsCache.length} in AUDAC’s CRM` + (keyCount ? `, key accounts first.` : '.') + ' Tap one for contacts and address.';
    const limit = (query || showAllCompanies) ? 200 : COMPANY_PAGE;
    $('companies-list').innerHTML = rows.length
      ? `<ul class="accts">${rows.slice(0, limit).map(companyItem).join('')}</ul>` +
        (rows.length > limit ? `<button type="button" class="button-secondary show-more" id="show-all-companies">Show all ${rows.length}</button>` : '')
      : '<p class="empty">No companies for your firm in AUDAC’s CRM yet.</p>';
    return rows.length;
  }

  $('companies-list').addEventListener('click', (e) => {
    if (e.target.closest('#show-all-companies')) { showAllCompanies = true; renderCompanies(); return; }
    const head = e.target.closest('.acct-head');
    if (!head) return;
    const id = head.closest('li').dataset.acct;
    openAcct = openAcct === id ? null : id;
    renderCompanies();
    const li = document.querySelector(`li[data-acct="${CSS.escape(id)}"] .acct-head`);
    if (li) li.focus();
  });

  // ---------- Deals ----------
  let dealsCache = [];
  const needsUpdate = (d) => d.status === 'Open' && d.expected_close_date && d.expected_close_date < todayIso && !d.pending_status;

  function dealItem(d) {
    const overdue = needsUpdate(d);
    const pending = d.pending_status
      ? `<span class="chip gold">${AudacShell.icon('check')}Update sent: ${esc(d.pending_status)}${d.pending_close_date ? ' · ' + esc(fmtDate(d.pending_close_date)) : ''}</span>` : '';
    const dateLine = d.status === 'Open'
      ? (d.expected_close_date ? `Expected close ${fmtDate(d.expected_close_date)}` : 'No expected close date')
      : `${d.status} ${d.actual_close_date ? fmtDate(d.actual_close_date) : ''}`;
    return `<li data-crm="${esc(d.crm_id)}">
      <div><b>${esc(d.project_name || '(no name)')}</b>
        <span class="sub">${esc(d.account_name || '')}${d.stage ? ' · ' + esc(d.stage) : ''} · <span class="value">${fmtMoney(d.value_usd)}</span></span>
        <span class="sub${overdue ? ' warn' : ''}">${dateLine}${overdue ? ' — date has passed. Still on?' : ''}</span></div>
      <div class="actions">${pending}${d.status === 'Open' ? `<button type="button" class="button-secondary" data-update="${esc(d.crm_id)}">${overdue ? 'Update status' : 'Update'}</button>` : ''}</div>
    </li>`;
  }

  function renderDeals() {
    const show = filter === 'all' || filter === 'deals';
    const rows = dealsCache.filter(d => hit(norm([d.project_name, d.account_name, d.stage, d.status].join(' '))));
    $('deals-section').hidden = !show || (!!query && !rows.length);
    if (!show) return 0;
    if (query) {
      $('deals-sub').textContent = `${rows.length} ${rows.length === 1 ? 'deal' : 'deals'} found.`;
      $('deals-list').innerHTML = rows.length ? `<ul class="list">${rows.map(dealItem).join('')}</ul>` : '';
      return rows.length;
    }
    if (!rows.length) {
      $('deals-sub').textContent = 'No deals are credited to your firm yet. Deals come from AUDAC’s CRM.';
      $('deals-list').innerHTML = '';
      return;
    }
    const overdue = rows.filter(needsUpdate);
    const open = rows.filter(d => d.status === 'Open' && !needsUpdate(d));
    const yearAgo = new Date(today.getTime() - 365 * DAY).toISOString().slice(0, 10);
    const closed = rows.filter(d => d.status !== 'Open' && (d.actual_close_date || d.created_date || '') >= yearAgo);
    const openValue = rows.filter(d => d.status === 'Open').reduce((s, d) => s + Number(d.value_usd || 0), 0);
    $('deals-sub').textContent = `${rows.filter(d => d.status === 'Open').length} open · ${fmtMoney(openValue)}. Won, lost or moved? Tap Update and AUDAC fixes the CRM.`;
    const group = (title, list) => list.length ? `<p class="group-title">${title}</p><ul class="list">${list.map(dealItem).join('')}</ul>` : '';
    $('deals-list').innerHTML = group('Past the close date: still on?', overdue) + group('Open', open) + group('Closed in the last 12 months', closed);
    return rows.length;
  }

  function openUpdateForm(crmId) {
    document.querySelectorAll('.update-form').forEach(f => f.remove());
    const li = document.querySelector(`li[data-crm="${CSS.escape(crmId)}"]`);
    const d = dealsCache.find(x => x.crm_id === crmId);
    if (!li || !d) return;
    const form = document.createElement('form');
    form.className = 'update-form';
    form.innerHTML = `
      <div class="field"><label for="u-status">What happened?</label>
        <select id="u-status"><option value="Open">Still open</option><option value="Won">Won</option><option value="Lost">Lost</option></select></div>
      <div class="field"><label for="u-date" id="u-date-label">New expected close date</label><input type="date" id="u-date"></div>
      <div class="field wide"><label for="u-note">Note for AUDAC (optional)</label><textarea id="u-note" placeholder="e.g. PO expected next week, or lost to a competitor on price"></textarea></div>
      <p class="form-msg" id="u-msg" hidden></p>
      <div class="form-actions"><button type="button" class="button-secondary" id="u-cancel">Cancel</button><button type="submit" class="button-primary" id="u-send">Send update</button></div>`;
    li.appendChild(form);
    const statusSel = form.querySelector('#u-status');
    const dateLabel = form.querySelector('#u-date-label');
    const syncLabel = () => { dateLabel.textContent = statusSel.value === 'Open' ? 'New expected close date' : `Date ${statusSel.value.toLowerCase()}`; };
    statusSel.addEventListener('change', syncLabel);
    syncLabel();
    form.querySelector('#u-cancel').addEventListener('click', () => form.remove());
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const status = statusSel.value, date = form.querySelector('#u-date').value || null, note = form.querySelector('#u-note').value;
      const msg = form.querySelector('#u-msg');
      if (status === 'Open' && !date) { msg.hidden = false; msg.textContent = 'Give the new expected close date, so AUDAC can update the deal.'; return; }
      const btn = form.querySelector('#u-send');
      btn.disabled = true; btn.textContent = 'Sending…';
      const { error } = await client.rpc('submit_deal_update', { p_crm_id: crmId, p_status: status, p_close_date: date, p_note: note });
      if (error) { msg.hidden = false; msg.textContent = 'Could not send the update: ' + error.message; btn.disabled = false; btn.textContent = 'Send update'; return; }
      Object.assign(d, { pending_status: status, pending_close_date: date, pending_at: new Date().toISOString() });
      renderAll();
    });
    statusSel.focus();
  }
  $('deals-list').addEventListener('click', (e) => {
    const b = e.target.closest('[data-update]');
    if (b) openUpdateForm(b.dataset.update);
  });

  // ---------- Leads ----------
  // route (decided in the database, crm_lead_route):
  //   rep        = AUDAC forwarded the lead to this firm (Parent Account = the rep firm)
  //   trade_show = booth visitor from this territory, handed to the firm after the show
  //   info       = web enquiry AVL Media Group answered: for information, no follow-up asked
  // "Qualified" in AUDAC's CRM = turned into an account + contact after the rep made contact.
  const OUTCOMES = { contacted: 'Contacted', meeting: 'Meeting or demo planned', project: 'Project or quote', not_relevant: 'Not interested / not a real lead' };
  const OUTCOME_CHIP = { contacted: 'gold', meeting: 'gold', project: 'ok', not_relevant: '' };
  const FOLLOW_UP_DAYS = AudacShell.LEAD_FOLLOW_UP_DAYS;
  let leadsCache = [];
  const leadDay = (l) => String(l.created_on || '').slice(0, 10);
  const isMine = (l) => l.route === 'rep' || l.route === 'trade_show';
  // Only recent leads handed to the firm ask for follow-up; the rest is history.
  const isActionable = (l) => isMine(l) && (!l.created_on || daysAgo(leadDay(l)) <= FOLLOW_UP_DAYS);
  const followedUp = (l) => !!l.outcome || l.crm_status_reason === 'Qualified';

  function originLine(l) {
    if (l.route === 'trade_show') {
      const show = /infocomm/i.test(l.subject || '') ? 'InfoComm' : 'a trade show';
      return `Visited the AUDAC booth at ${show} ${String(l.created_on || '').slice(0, 4)}`;
    }
    if (l.route === 'info') return `Web enquiry · answered by AVL Media Group · ${fmtDate(leadDay(l))}`;
    return `Forwarded to you by AUDAC · ${fmtDate(leadDay(l))}`;
  }

  function leadItem(l) {
    const mine = isActionable(l);
    const age = l.created_on ? daysAgo(leadDay(l)) : null;

    const place = [l.city, l.state_code].filter(Boolean).join(', ');
    const who = l.company && l.full_name ? `${esc(l.full_name)} · ${esc(l.company)}` : esc(l.company || l.full_name || '(no name)');
    const contact = [
      l.email ? `<a href="mailto:${esc(l.email)}">${esc(l.email)}</a>` : '',
      l.phone ? `<a href="tel:${esc(String(l.phone).replace(/[^\d+]/g, ''))}">${esc(l.phone)}</a>` : '',
    ].filter(Boolean).join('');
    // Trade-show leads carry the list name as subject ("INFOCOMM US LEADS 2026"): not worth repeating.
    const ask = [l.route === 'trade_show' ? null : l.subject, l.description].filter(Boolean).join(' — ');
    const status = l.outcome
      ? `<span class="chip ${OUTCOME_CHIP[l.outcome] || ''}">${esc(OUTCOMES[l.outcome] || l.outcome)} · ${esc(fmtDate(String(l.outcome_at).slice(0, 10)))}</span>`
      : l.crm_status_reason === 'Qualified' ? `<span class="chip ok">${AudacShell.icon('check')}Followed up</span>` : '';
    return `<li data-lead="${esc(l.external_id)}">
      <div><b>${who}</b><span class="sub">${esc([place, originLine(l)].filter(Boolean).join(' · '))}</span>
        ${contact ? `<span class="lead-contact">${contact}</span>` : ''}
        ${ask ? `<p class="lead-desc">${esc(ask.length > 220 ? ask.slice(0, 220) + '…' : ask)}</p>` : ''}
        ${l.outcome_note ? `<span class="sub">Your note: ${esc(l.outcome_note)}</span>` : ''}
        </div>
      <div class="actions">${status}${mine ? `<button type="button" class="button-secondary" data-lead-update="${esc(l.external_id)}">${l.outcome ? 'Update' : 'What came of it?'}</button>` : ''}</div>
    </li>`;
  }

  function renderLeads() {
    const show = filter === 'all' || filter === 'leads';
    const found = leadsCache.filter(l => hit(norm([l.full_name, l.company, l.email, l.phone, l.city, l.state_code, l.subject, l.description].join(' '))));
    $('leads-section').hidden = !show || (!!query && !found.length);
    if (!show) return 0;
    if (query) {
      $('leads-sub').textContent = `${found.length} ${found.length === 1 ? 'lead' : 'leads'} found.`;
      $('leads-list').innerHTML = found.length ? `<ul class="list">${found.map(leadItem).join('')}</ul>` : '';
      return found.length;
    }
    const current = leadsCache.filter(isActionable);
    const earlier = leadsCache.filter(l => !isActionable(l));
    const todo = current.filter(l => !followedUp(l));
    const done = current.filter(followedUp);
    $('leads-sub').textContent = current.length
      ? (todo.length
        ? `${todo.length} new. A quick “What came of it?” helps AUDAC send you better leads.`
        : 'All recent leads handled. Thanks.')
      : 'No new leads right now. New enquiries from your territory show up here, and you get an e-mail.';
    const group = (title, list) => list.length ? `<p class="group-title">${title}</p><ul class="list">${list.map(leadItem).join('')}</ul>` : '';
    $('leads-list').innerHTML = group('New for you', todo) + group('Done', done) +
      (earlier.length ? `<details class="older"><summary>Earlier leads from your territory (${earlier.length}) · for reference</summary>
        <p class="empty">Leads from more than ${FOLLOW_UP_DAYS} days ago, such as the InfoComm 2026 booth visitors, and web enquiries AVL Media Group answered. Shown as history; no follow-up is asked.</p>
        <ul class="list">${earlier.map(leadItem).join('')}</ul></details>` : '');
    return leadsCache.length;
  }

  // Gold counts on the filters: leads waiting for a word, deals past their date.
  function renderCounts() {
    const set = (id, n) => { $(id).textContent = n || ''; $(id).hidden = !n; };
    set('n-leads', leadsCache.filter(l => isActionable(l) && !followedUp(l)).length);
    set('n-deals', dealsCache.filter(needsUpdate).length);
  }

  function renderAll() {
    renderCounts();
    const n = renderLeads() + renderCompanies() + renderDeals();
    const nr = $('no-results');
    nr.hidden = !query || n > 0;
    if (!nr.hidden) nr.innerHTML = `Nothing in your territory matches “${esc(query)}”. Not in AUDAC’s CRM yet? <a href="/form">Log activity</a> and add it as a new company.`;
  }

  $('q').addEventListener('input', () => {
    query = norm($('q').value.trim());
    openAcct = null;
    renderAll();
  });
  document.querySelector('.filters').addEventListener('click', (e) => {
    const b = e.target.closest('[data-filter]');
    if (!b) return;
    filter = b.dataset.filter;
    document.querySelectorAll('.filters [data-filter]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    renderAll();
  });

  function openLeadForm(id) {
    document.querySelectorAll('.update-form').forEach(f => f.remove());
    const li = document.querySelector(`li[data-lead="${CSS.escape(id)}"]`);
    const l = leadsCache.find(x => x.external_id === id);
    if (!li || !l) return;
    const form = document.createElement('form');
    form.className = 'update-form lead-form';
    form.innerHTML = `
      <div class="field"><label for="l-outcome">What happened?</label>
        <select id="l-outcome">${Object.entries(OUTCOMES).map(([k, v]) => `<option value="${k}"${k === (l.outcome || 'contacted') ? ' selected' : ''}>${v}</option>`).join('')}</select></div>
      <div class="field"><label for="l-note">Anything AUDAC should know? (optional)</label><textarea id="l-note" placeholder="e.g. demo at their office on the 12th, quoting a school project, or: not a real project, residential only"></textarea></div>
      <p class="form-msg" id="l-msg" hidden></p>
      <div class="form-actions"><button type="button" class="button-secondary" id="l-cancel">Cancel</button><button type="submit" class="button-primary" id="l-send">Save</button></div>`;
    li.appendChild(form);
    form.querySelector('#l-cancel').addEventListener('click', () => form.remove());
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const outcome = form.querySelector('#l-outcome').value, note = form.querySelector('#l-note').value;
      const btn = form.querySelector('#l-send'), msg = form.querySelector('#l-msg');
      btn.disabled = true; btn.textContent = 'Saving…';
      const { error } = await client.rpc('submit_lead_followup', { p_lead: id, p_outcome: outcome, p_note: note });
      if (error) { msg.hidden = false; msg.textContent = 'Could not save: ' + error.message; btn.disabled = false; btn.textContent = 'Save'; return; }
      Object.assign(l, { outcome, outcome_note: note.trim() || null, outcome_at: new Date().toISOString() });
      renderAll();
    });
    form.querySelector('#l-outcome').focus();
  }
  $('leads-list').addEventListener('click', (e) => {
    const b = e.target.closest('[data-lead-update]');
    if (b) openLeadForm(b.dataset.leadUpdate);
  });

  async function init() {
    const { data: { session } } = await client.auth.getSession();
    if (!session) { window.location.href = '/login'; return; }
    // Slow networks: all five requests leave at once (the RPCs are firm-scoped
    // on the server, so they need nothing from the profile).
    const dataP = Promise.all([client.rpc('get_my_territory'), client.rpc('get_my_deals'), client.rpc('get_my_leads')]);
    const [{ data: profile }, { data: firms }] = await Promise.all([
      client.from('profiles').select('*').eq('id', session.user.id).maybeSingle(),
      client.from('rep_firms').select('id, name'),
    ]);
    if (profile?.role === 'manager') { window.location.href = '/dashboard'; return; }
    if (profile?.role === 'executive') { window.location.href = '/executive'; return; }
    if (window.AudacOutbox) AudacOutbox.init(client, session.user.id); // sends what waits, quietly
    const firm = (firms || []).find(f => f.id === profile?.rep_firm_id);
    AudacShell.setUser({ name: profile?.full_name || session.user.email, sub: firm ? firm.name : session.user.email });
    AudacShell.setSection(firm ? firm.name : '');
    if (profile?.is_active === false || !firm) {
      $('gate').innerHTML = `<div class="notice info">${profile?.is_active === false
        ? 'Your portal account has been deactivated, so this page is not available.'
        : 'Your account isn’t linked to a rep firm yet. Use your firm’s signup link, or pick your firm on your first activity.'}</div>`;
      $('search-bar').hidden = true; $('companies-section').hidden = true; $('deals-section').hidden = true; $('leads-section').hidden = true;
      $('page').setAttribute('aria-busy', 'false');
      return;
    }
    try { localStorage.setItem('audac_seen_territory', '1'); } catch { /* private mode */ }
    const [acctRes, dealRes, leadRes] = await dataP;
    leadsCache = leadRes.data || [];
    dealsCache = dealRes.data || [];
    accountsCache = (acctRes.data || []).map(a => ({ ...a, _hay: companyHay(a) }));
    // ?q= opens the page on a search (e.g. from a link elsewhere in the portal).
    const q0 = new URLSearchParams(location.search).get('q');
    if (q0) { $('q').value = q0; query = norm(q0.trim()); }
    renderAll();
    if (leadRes.error) $('leads-sub').textContent = 'Could not load leads: ' + leadRes.error.message;
    if (acctRes.error) $('companies-sub').textContent = 'Could not load companies: ' + acctRes.error.message;
    if (dealRes.error) $('deals-sub').textContent = 'Could not load deals: ' + dealRes.error.message;
    $('page').setAttribute('aria-busy', 'false');
    if (location.hash === '#deals') $('deals-section').scrollIntoView();
    if (location.hash === '#leads') $('leads-section').scrollIntoView();
  }
  init().catch(err => { $('gate').innerHTML = `<div class="notice error">Couldn’t load this page: ${esc(err.message || err)}. Refresh to try again.</div>`; });
</script>
</body>
</html>
