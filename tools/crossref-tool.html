<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* AUDAC brand palette — dark theme */
  --bg:     #0C0C0C;
  --bg1:    #141414;
  --bg2:    #1C1C1C;
  --bg3:    #242424;
  --bg4:    #2C2C2C;
  --gold:        #C8A040;
  --gold-bright: #E0B84C;
  --gold-dim:    rgba(200,160,64,.12);
  --gold-bdr:    rgba(200,160,64,.28);
  --gold-glow:   rgba(200,160,64,.18);
  --txt:    #F2F2F2;
  --txt2:   #8A8A8A;
  --txt3:   #4A4A4A;
  --bdr:    #242424;
  --bdr2:   #2E2E2E;
  --green:       #34C759;
  --green-dim:   rgba(52,199,89,.14);
  --green-bdr:   rgba(52,199,89,.35);
  --amber:       #FF9500;
  --amber-dim:   rgba(255,149,0,.14);
  --amber-bdr:   rgba(255,149,0,.35);
  --r: 14px;
  --safe-top:    env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
html{height:100%;-webkit-text-size-adjust:100%;background:var(--bg)}
body{
  height:100%;background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',system-ui,sans-serif;
  color:var(--txt);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  overscroll-behavior:none;
}
.app{display:flex;flex-direction:column;height:100dvh;height:100vh}

/* ── Top bar ─────────────────────────────────────────────────────── */
.topbar{
  background:var(--bg1);
  padding:calc(var(--safe-top) + 10px) 18px 10px;
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;border-bottom:1px solid var(--bdr);
}
.tb-logo{display:flex;align-items:center;margin-bottom:2px}
.tb-sub{font-size:10px;color:var(--txt3);margin-top:1px;letter-spacing:.3px}
.tb-badge{
  font-size:10px;font-weight:700;color:var(--gold);letter-spacing:.3px;
  background:var(--gold-dim);border:1px solid var(--gold-bdr);
  border-radius:20px;padding:4px 11px;
}
.gold-line{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);flex-shrink:0;opacity:.5}

/* ── Search + filter ─────────────────────────────────────────────── */
.sticky-head{background:var(--bg1);flex-shrink:0;border-bottom:1px solid var(--bdr)}
.search-row{display:flex;align-items:center;gap:10px;padding:12px 16px 10px}
.search-wrap{position:relative;flex:1}

/* Frame div carries all visual styling — browser can't override a div */
.sb-frame{
  position:relative;
  display:flex;align-items:center;
  height:46px;
  background:#161616;
  border-top:1px solid var(--bdr2);
  border-right:1px solid var(--bdr2);
  border-bottom:1px solid var(--bdr2);
  border-left:2.5px solid var(--gold);
  border-radius:10px;
  overflow:hidden;
  transition:border-color .18s, background .18s;
}
.sb-frame:focus-within{
  background:#1A1A1A;
  border-left-color:var(--gold-bright);
}
.sb-frame:focus-within .search-ico{color:var(--gold)}

.search-ico{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  color:var(--txt3);pointer-events:none;display:flex;
  transition:color .18s;z-index:1;
}
.clear-btn{
  position:absolute;right:0;top:0;bottom:0;
  width:40px;display:none;
  align-items:center;justify-content:center;
  background:none;border:none;cursor:pointer;
  color:var(--txt3);
  -webkit-tap-highlight-color:transparent;z-index:1;
}
.clear-btn.vis{display:flex}

/* Input is fully transparent — browser can't inject a background here */
#sb{
  position:absolute;inset:0;
  width:100%;height:100%;
  padding:0 40px 0 44px;
  background:transparent !important;
  border:none !important;
  outline:none !important;
  box-shadow:none !important;
  -webkit-appearance:none;appearance:none;
  font-size:16px;font-family:inherit;
  color:var(--txt);
  caret-color:var(--gold);
  color-scheme:dark;
  /* Kill autofill styling */
  -webkit-box-shadow:0 0 0 60px #161616 inset !important;
  -webkit-text-fill-color:var(--txt) !important;
}
#sb::placeholder{color:var(--txt3)}
#sb:focus{background:transparent !important}

/* Filter button — same visual language as search frame */
.filter-btn{
  flex-shrink:0;height:46px;min-width:46px;padding:0 14px;
  background:#161616;
  border-top:1px solid var(--bdr2);
  border-right:1px solid var(--bdr2);
  border-bottom:1px solid var(--bdr2);
  border-left:2.5px solid var(--bdr2);
  border-radius:10px;
  display:flex;align-items:center;justify-content:center;gap:6px;
  cursor:pointer;font-size:13px;font-weight:600;color:var(--txt2);
  font-family:inherit;-webkit-tap-highlight-color:transparent;
  touch-action:manipulation;transition:all .18s;white-space:nowrap;
}
.filter-btn.active{
  border-left-color:var(--gold);
  color:var(--gold-bright);
  background:#1A1A1A;
}
.fbadge{
  min-width:18px;height:18px;background:var(--gold);color:var(--bg);
  border-radius:9px;font-size:10px;font-weight:800;
  display:inline-flex;align-items:center;justify-content:center;padding:0 5px;
}

/* Active chips */
.active-filters{display:flex;gap:6px;padding:0 16px 10px;flex-wrap:wrap}
.af-chip{
  display:inline-flex;align-items:center;gap:4px;
  background:var(--gold-dim);border:1px solid var(--gold-bdr);
  color:var(--gold-bright);border-radius:20px;
  padding:5px 8px 5px 12px;font-size:12px;font-weight:600;
}
.af-chip button{
  background:none;border:none;cursor:pointer;
  color:rgba(200,160,64,.6);display:flex;padding:0 2px;
  -webkit-tap-highlight-color:transparent;
}

/* ── Content ─────────────────────────────────────────────────────── */
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.count-bar{padding:12px 18px 6px;font-size:11px;font-weight:600;color:var(--txt3);letter-spacing:.2px}

/* ── Result rows ─────────────────────────────────────────────────── */
.results{margin:0 14px 16px;border-radius:var(--r);overflow:hidden;
  border:1px solid var(--bdr2);background:var(--bg1)}
.res-hdr{
  background:var(--bg2);
  display:grid;grid-template-columns:1fr auto;
  padding:8px 16px;gap:8px;border-bottom:1px solid var(--bdr);
}
.res-hdr-txt{font-size:9.5px;font-weight:700;color:var(--txt3);
  text-transform:uppercase;letter-spacing:1px}
.res-row{
  display:grid;grid-template-columns:1fr auto;align-items:center;
  padding:14px 16px;gap:12px;cursor:pointer;min-height:66px;
  border-top:1px solid var(--bdr);
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  transition:background .12s;position:relative;
}
.res-row:first-of-type{border-top:none}
.res-row:active{background:var(--bg3)}
/* Gold left accent on tap */
.res-row::before{content:'';position:absolute;left:0;top:0;bottom:0;
  width:2px;background:var(--gold);opacity:0;transition:opacity .12s}
.res-row:active::before{opacity:1}
.res-model{font-size:15px;font-weight:600;color:var(--txt);line-height:1.25;letter-spacing:-.1px}
.res-meta{font-size:11.5px;color:var(--txt3);margin-top:3px;letter-spacing:.1px}
.res-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.res-audac{font-size:14px;font-weight:700;color:var(--gold-bright);letter-spacing:.2px}
.res-stars{font-size:12px;font-weight:700;letter-spacing:.5px}
.s-hi{color:var(--green)} .s-lo{color:var(--amber)}

/* ── Empty ───────────────────────────────────────────────────────── */
.empty{display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:64px 32px;text-align:center;gap:12px}
.empty-ico{color:var(--txt3);opacity:.4}
.empty-title{font-size:16px;font-weight:600;color:var(--txt2)}
.empty-sub{font-size:13px;color:var(--txt3);line-height:1.6}

/* ── Bottom sheet ────────────────────────────────────────────────── */
.backdrop{
  position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,.7);
  opacity:0;pointer-events:none;
  transition:opacity .25s;
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;bottom:0;left:0;right:0;z-index:201;
  background:rgba(20,20,20,.96);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  backdrop-filter:blur(24px) saturate(180%);
  border:1px solid rgba(200,160,64,.18);
  border-radius:22px 22px 0 0;
  max-height:85vh;display:flex;flex-direction:column;
  transform:translateY(100%);
  transition:transform .32s cubic-bezier(.32,.72,0,1);
}
.sheet.open{transform:translateY(0)}
.sheet-pip{width:32px;height:4px;background:var(--bg4);border-radius:2px;margin:12px auto 0}
.sheet-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 20px 10px;flex-shrink:0;border-bottom:1px solid var(--bdr);
}
.sheet-title{font-size:15px;font-weight:700;color:var(--txt);letter-spacing:-.1px}
.sheet-clear{font-size:13px;font-weight:600;color:var(--gold);
  background:none;border:none;cursor:pointer;font-family:inherit;
  -webkit-tap-highlight-color:transparent}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:16px 16px 8px;flex:1}
.sheet-section{margin-bottom:22px}
.sheet-lbl{font-size:10px;font-weight:700;color:var(--txt3);
  text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.opt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{
  padding:11px 8px;background:var(--bg2);border:1.5px solid var(--bdr2);
  border-radius:12px;text-align:center;cursor:pointer;
  font-size:12.5px;font-weight:600;color:var(--txt2);
  font-family:inherit;line-height:1.3;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  transition:all .15s;
}
.opt .cnt{display:block;font-size:10px;font-weight:500;color:var(--txt3);margin-top:2px}
.opt.active{background:var(--gold-dim);border-color:var(--gold-bdr);color:var(--gold-bright)}
.opt.active .cnt{color:rgba(200,160,64,.65)}
.opt:active{opacity:.6}
.sheet-footer{padding:10px 16px calc(12px + var(--safe-bottom));flex-shrink:0;border-top:1px solid var(--bdr)}
.done-btn{
  width:100%;height:52px;background:var(--gold);color:var(--bg);
  border:none;border-radius:var(--r);
  font-size:15px;font-weight:800;font-family:inherit;cursor:pointer;
  letter-spacing:.2px;-webkit-tap-highlight-color:transparent;
  transition:opacity .15s;
}
.done-btn:active{opacity:.8}

/* ── Detail card ─────────────────────────────────────────────────── */
.card-screen{
  position:fixed;inset:0;background:var(--bg);
  z-index:100;overflow-y:auto;-webkit-overflow-scrolling:touch;
  transform:translateX(100%);
  transition:transform .28s cubic-bezier(.32,.72,0,1);
}
.card-screen.open{transform:translateX(0)}
.card-nav{
  position:sticky;top:0;z-index:10;
  background:rgba(12,12,12,.92);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--bdr);
  padding:calc(var(--safe-top) + 10px) 18px 10px;
  display:flex;align-items:center;
}
.back-btn{
  display:flex;align-items:center;gap:6px;background:none;border:none;
  cursor:pointer;color:var(--gold);font-size:14px;font-weight:600;
  font-family:inherit;padding:6px 0;letter-spacing:.1px;
  -webkit-tap-highlight-color:transparent;
}
.card-body{padding:20px 18px calc(32px + var(--safe-bottom))}

/* Match hero */
.hero{
  background:var(--bg1);border:1px solid var(--bdr2);
  border-radius:18px;padding:20px;margin-bottom:16px;
  position:relative;overflow:hidden;
}
/* Gold glow top edge */
.hero::before{
  content:'';position:absolute;top:0;left:20%;right:20%;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
}
.hero-brand{font-size:10px;font-weight:700;color:var(--txt3);
  text-transform:uppercase;letter-spacing:1.2px;margin-bottom:6px}
.hero-model{font-size:26px;font-weight:800;color:var(--txt);
  line-height:1.15;letter-spacing:-.3px;margin-bottom:4px}
.hero-spec{font-size:12px;color:var(--txt3);letter-spacing:.1px}
.hero-divider{
  display:flex;align-items:center;gap:10px;padding:14px 0;
}
.hero-div-line{flex:1;height:1px;background:var(--bdr2)}
.hero-div-ico{color:var(--gold);opacity:.7;display:flex}
.hero-al{font-size:10px;font-weight:700;color:var(--gold);
  text-transform:uppercase;letter-spacing:1.2px;margin-bottom:6px}
.hero-sku{
  font-size:32px;font-weight:900;color:var(--gold-bright);
  letter-spacing:-.5px;line-height:1.1;margin-bottom:4px;
}
.hero-asp{font-size:12px;color:var(--txt3);letter-spacing:.1px}

/* Match badge */
.badge-row{margin-bottom:14px}
.badge{
  display:inline-flex;align-items:center;gap:7px;
  padding:8px 16px;border-radius:24px;
  font-size:13px;font-weight:700;font-family:inherit;letter-spacing:.1px;
}
.b-dir{background:var(--green-dim);color:var(--green);border:1px solid var(--green-bdr)}
.b-alt{background:var(--amber-dim);color:var(--amber);border:1px solid var(--amber-bdr)}

/* Pitch box */
.pitch{
  background:var(--bg1);border:1px solid var(--gold-bdr);
  border-radius:16px;padding:16px;margin-bottom:16px;
}
.pitch-lbl{
  display:flex;align-items:center;gap:6px;margin-bottom:10px;
}
.pitch-lbl span{
  font-size:9.5px;font-weight:700;color:var(--gold);
  text-transform:uppercase;letter-spacing:1.2px;
}
.pitch-txt{font-size:14px;color:var(--txt);line-height:1.8;white-space:pre-line}

/* Action buttons */
.actions{display:flex;flex-direction:column;gap:10px}
.btn{
  display:flex;align-items:center;justify-content:center;gap:9px;
  width:100%;height:52px;border-radius:var(--r);
  font-size:15px;font-weight:700;font-family:inherit;letter-spacing:.1px;
  cursor:pointer;border:none;-webkit-tap-highlight-color:transparent;
  touch-action:manipulation;transition:opacity .15s;
}
.btn:active{opacity:.7}
.btn-copy{background:var(--bg2);color:var(--txt);border:1.5px solid var(--bdr2)}
.btn-link{background:var(--gold);color:var(--bg);font-weight:800}
.btn-ok  {background:var(--green-dim);color:var(--green);border:1px solid var(--green-bdr)}

/* Category label in results */
.res-meta .cat-tag{color:var(--gold);opacity:.7;font-size:10px}

/* Best Application box */
.bestapp-box{
  background:var(--bg2);border:1px solid var(--bdr2);
  border-radius:var(--r);padding:14px;margin-bottom:14px;
}
.bestapp-lbl{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.bestapp-lbl span{font-size:9.5px;font-weight:700;color:var(--txt3);
  text-transform:uppercase;letter-spacing:1.2px}
.bestapp-txt{font-size:13px;color:var(--txt2);line-height:1.6}
</style>
</head>
