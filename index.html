<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AUDAC Rep Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/audac-ui.css">
<meta name="theme-color" content="#0b0c0e">
<style>
  .wrap { min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: var(--space-6) var(--space-4); }
  .card { width: 100%; max-width: 440px; padding: var(--space-8) var(--space-6); text-align: center; }
  .brand { display: flex; align-items: baseline; justify-content: center; gap: var(--space-2); margin-bottom: var(--space-6); }
  .brand b { font-size: 26px; letter-spacing: 6px; font-weight: 700; }
  .brand span { font-size: 12px; color: var(--color-text-muted); }
  .card p { margin: 0 0 var(--space-6); color: var(--color-text-secondary); font-size: 15px; line-height: 23px; }
  .card .button-primary { width: 100%; }
  .card .small { margin: var(--space-5) 0 0; font-size: 13px; line-height: 19px; color: var(--color-text-muted); }
</style>
</head>
<body>
<div class="wrap">
  <div class="card surface-card--elevated">
    <div class="brand"><b>AUDAC</b><span>Rep Portal</span></div>
    <p>The AUDAC North America rep portal: log your visits, demos and trainings, and see everything you’ve submitted.</p>
    <a class="button-primary" href="/login">Sign in</a>
    <p class="small">New rep? Use the signup link your firm received from AUDAC. It connects your account to your firm automatically.</p>
  </div>
</div>
</body>
</html>
